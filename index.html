<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Chánh Tinh Tấn English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#A85A0A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,600;1,400&family=Noto+Sans:wght@400;600&display=swap">
<style>/* Layout: một cột kiểu app điện thoại — thanh trên, nội dung cuộn, thanh tab dưới; màn hình học phủ toàn màn. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --surface2:#E6ECE3; --ink:#1C2521; --muted:#5B685F; --line:#D2DACE;
  --saffron:#A85A0A; --saffron-ink:#FFFFFF; --saffron-soft:#F5E2C8; --bodhi:#2E6447; --bodhi-soft:#DCEBDF;
  --ok:#2C7A4C; --ok-soft:#DDF0E3; --bad:#B23A2F; --bad-soft:#F8E0DC; --hole:#EBDDC4; --hl:#FFE7B3; --ph:#7A5A2E;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-text:"Literata",Georgia,"Times New Roman",serif;
  --fs:1; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --surface2:#222C27; --ink:#E6ECE5; --muted:#9BA89F; --line:#2F3B34;
  --saffron:#E49A47; --saffron-ink:#1A1206; --saffron-soft:#3A2915; --bodhi:#7CC39A; --bodhi-soft:#1E3328;
  --ok:#6FC793; --ok-soft:#173226; --bad:#EE8277; --bad-soft:#3A1E1B; --hole:#3A3121; --hl:#4A3A16; --ph:#D9B98A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --surface2:#222C27; --ink:#E6ECE5; --muted:#9BA89F; --line:#2F3B34;
  --saffron:#E49A47; --saffron-ink:#1A1206; --saffron-soft:#3A2915; --bodhi:#7CC39A; --bodhi-soft:#1E3328;
  --ok:#6FC793; --ok-soft:#173226; --bad:#EE8277; --bad-soft:#3A1E1B; --hole:#3A3121; --hl:#4A3A16; --ph:#D9B98A; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
a.btn{text-decoration:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(16px*var(--fs));line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-family:var(--f-text);font-weight:600;font-size:1.08em;line-height:1.15;display:block}
.brand small{display:block;color:var(--muted);font-size:.72em;letter-spacing:.06em;text-transform:uppercase}
.chip-streak{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;background:var(--saffron-soft);color:var(--saffron);font-weight:700;font-variant-numeric:tabular-nums}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;flex:none}
.iconbtn:active{background:var(--surface2)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);font-size:.7em;font-weight:600;min-width:0}
.tab[aria-current="true"]{color:var(--saffron)}
h1,h2,h3{font-family:var(--f-text);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.25em} h3{font-size:1.05em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86em}
.eyebrow{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--ink);text-align:center}
.btn.pri{background:var(--saffron);color:var(--saffron-ink)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88em;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74em;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.c-dharma{background:var(--saffron-soft);color:var(--saffron)}
.pill.c-practice{background:var(--bodhi-soft);color:var(--bodhi)}
.pill.c-key{background:var(--hole);color:var(--ink)}
/* hôm nay */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .n b{font-size:1.5em;font-family:var(--f-text)}
.week{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.week span{width:26px;text-align:center;font-size:.68em;color:var(--muted)}
.week i{display:block;width:14px;height:14px;margin:0 auto 2px;border-radius:50%;border:2px solid var(--line)}
.week i.on{background:var(--saffron);border-color:var(--saffron)}
.week i.part{border-color:var(--saffron)}
.week i.frz{background:var(--bodhi-soft);border-color:var(--bodhi)}
.today .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* bản đồ hành trình */
.journey{position:relative;padding:4px 0}
.journey svg.road{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.stations{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;list-style:none;margin:0;padding:0}
.st{display:flex;align-items:center;gap:12px;width:78%;text-align:left}
.st:nth-child(even){margin-left:auto;flex-direction:row-reverse;text-align:right}
.st .dot{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-text);font-weight:600;font-size:1.25em;background:var(--surface);border:3px solid var(--line);font-variant-numeric:tabular-nums}
.st.done .dot{background:var(--bodhi);border-color:var(--bodhi);color:var(--surface)}
.st.cur .dot{border-color:var(--saffron);color:var(--saffron);box-shadow:0 0 0 6px var(--saffron-soft)}
.st.lock{opacity:.5}
.st .lbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.st .lbl b{display:block;font-size:.95em}
.st .lbl span{font-size:.76em;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.72em;font-weight:600;padding:8px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.badge .bi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.badge.on .bi{background:var(--saffron);color:var(--saffron-ink)}
.badge:not(.on){opacity:.6}
/* biểu đồ tuần */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.7em;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--saffron)}
.bars i.lo{background:var(--saffron-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-text);font-size:1.4em;font-variant-numeric:tabular-nums}
.stat span{font-size:.74em;color:var(--muted)}
/* lưới công cụ */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tool .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--saffron-soft);color:var(--saffron)}
.tool.g .ic{background:var(--bodhi-soft);color:var(--bodhi)}
.tool b{font-size:.98em}
.tool span{font-size:.8em;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;font-weight:700}
/* danh sách từ */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;flex:1;min-width:0;height:44px;outline:none}
.wlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.witem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.witem:last-child{border-bottom:0}
.witem .th{width:60px;height:40px;border-radius:8px;overflow:hidden;flex:none}
.witem .th svg{width:100%;height:100%;display:block}
.witem .en{font-weight:600}
.witem .vi{font-size:.86em;color:var(--muted)}
.witem .ipa{font-size:.78em;color:var(--ph)}
.witem.sel{grid-template-columns:auto auto 1fr auto}
.cbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.cbox.on{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.cbox svg{width:16px;height:16px;stroke-width:3}
.star{color:var(--line)} .star.on{color:var(--saffron)} .star.on svg{fill:currentColor}
.lotus{display:inline-flex;gap:2px}
.lotus i{width:7px;height:12px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:var(--surface2)}
.lotus i.on{background:#E06C8E}
.fgroup{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86em;font-weight:500}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crit{background:var(--saffron-soft);border-radius:var(--r);padding:14px 16px}
.crit ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.crit li b{color:var(--saffron)}
/* minh họa */
.ill{border-radius:14px;overflow:hidden;width:100%;max-width:420px;margin:0 auto;aspect-ratio:3/2}
.ill svg{width:100%;height:100%;display:block}
/* phiên âm */
.phon{display:flex;flex-direction:column;gap:2px;align-items:center}
.phon .ipa{font-size:1.05em;color:var(--ph);font-family:"Noto Sans","Segoe UI",system-ui,sans-serif}
.phon .vn{font-size:.95em;color:var(--muted);font-weight:600;letter-spacing:.02em}
.rt .tk{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.25;margin-bottom:4px}
.rt .tk .ph{font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;font-size:.64em;color:var(--ph);line-height:1.1;white-space:nowrap}
/* kinh */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 4px;border-radius:9px;font-weight:600;font-size:.84em;color:var(--muted);line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.para{display:flex;flex-direction:column;gap:10px}
.pair{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0;padding-bottom:0}
.en-text{font-family:var(--f-text);font-size:1.06em;line-height:1.75}
.vi-text{font-size:.94em;line-height:1.6;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.vi-text.blur{filter:blur(5px);cursor:pointer;user-select:none}
.gnote{font-size:.86em;background:var(--bodhi-soft);color:var(--ink);border-radius:10px;padding:10px 12px}
.gbtn{display:inline-flex;align-items:center;gap:4px;font-size:.78em;font-weight:600;color:var(--bodhi);padding:2px 8px;border-radius:99px;border:1px solid var(--bodhi);vertical-align:middle}
.sn{border-radius:4px;cursor:pointer}
.sn.now{background:var(--hl)}
.tk.now{color:var(--saffron);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.term{border-bottom:2px dotted var(--saffron);cursor:pointer}
.term.sel{border-bottom-style:solid}
.lhead{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.lhead .eyebrow{color:var(--saffron)}
.player{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.player .wrap{display:flex;flex-direction:column;gap:6px;padding-block:8px}
.prog{display:flex;align-items:center;gap:8px;font-size:.78em;color:var(--muted);font-variant-numeric:tabular-nums}
.prog input{flex:1;accent-color:var(--saffron);min-width:0}
.pbtns{display:flex;align-items:center;justify-content:space-between;gap:4px}
.playbig{width:52px;height:52px;border-radius:50%;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center;flex:none}
.playbig svg{width:26px;height:26px}
.tog{padding:6px 9px;border-radius:9px;font-size:.78em;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--bodhi-soft);color:var(--bodhi);border-color:var(--bodhi)}
.chantpad{height:180px}
.mw{border-radius:4px}
.mw.hid{color:transparent;background:var(--hole);cursor:pointer}
.mw.ini{color:var(--muted)}
.vipop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;background:var(--surface);border:2px solid var(--saffron);border-radius:16px;padding:16px 18px;max-width:min(92vw,520px);font-size:1.05em;box-shadow:0 10px 30px rgba(0,0,0,.18)}
/* overlay */
#ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ovtop{position:sticky;top:0;z-index:2;background:var(--bg)}
.ovtop .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bodhi);border-radius:5px;transition:width .3s}
.ovbody .wrap{padding-block:12px 28px;display:flex;flex-direction:column;gap:16px}
.ovtitle{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* thẻ từ */
.fc{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px 16px;cursor:pointer}
.fc .big{font-family:var(--f-text);font-size:1.7em;font-weight:600;line-height:1.25;text-wrap:balance}
.fc .vi{font-size:1.3em;font-weight:600;color:var(--saffron)}
.fc .ex{font-family:var(--f-text);font-size:.96em;line-height:1.6;text-align:left;border-top:1px solid var(--line);padding-top:12px;width:100%}
.meo{font-size:.9em;background:var(--saffron-soft);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.stress{font-weight:700;color:var(--saffron)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:6px 4px;min-height:58px;font-size:.88em}
.grades .btn small{font-weight:400;font-size:.78em;opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps5{display:flex;gap:4px}
.steps5 span{flex:1;font-size:.66em;text-align:center;padding:4px 2px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:600}
.steps5 span.on{background:var(--saffron);color:var(--saffron-ink)}
.steps5 span.dn{background:var(--bodhi-soft);color:var(--bodhi)}
/* luyện nói */
.say{font-family:var(--f-text);font-size:1.28em;line-height:1.9;text-wrap:pretty}
.say .tk.ok,.say .tk.ok .w{color:var(--ok)}
.say .tk.no{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.hole{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;min-width:3.2em;border-bottom:3px solid var(--saffron);background:var(--hole);border-radius:6px 6px 0 0;padding:0 6px;margin:0 1px;cursor:pointer;line-height:1.35}
.hole .hg{font-family:var(--f-ui);font-size:.62em;color:var(--saffron);font-weight:600;padding:1px 0}
.hole .hw{visibility:hidden;height:0;overflow:hidden}
.hole.peek .hw,.hole.rev .hw{visibility:visible;height:auto}
.hole.rev{background:transparent}
.hole.rev.ok{border-color:var(--ok);color:var(--ok)}
.hole.rev.no{border-color:var(--bad);color:var(--bad)}
.hin{width:7.5em;max-width:60vw;border:0;border-bottom:3px solid var(--saffron);background:var(--hole);border-radius:6px 6px 0 0;padding:2px 6px;font-family:var(--f-text);font-size:.9em}
.ini .us{letter-spacing:.05em;color:var(--line)}
.mic{width:84px;height:84px;border-radius:50%;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center;margin:0 auto;position:relative}
.mic svg{width:36px;height:36px}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--saffron);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.mic.on::after,.recdot{animation:none}.bar i{transition:none}}
.heard{min-height:1.5em;text-align:center;color:var(--muted);font-style:italic}
.score{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px}
.score.ok{background:var(--ok-soft);color:var(--ok)}
.score.mid{background:var(--saffron-soft);color:var(--saffron)}
.score.no{background:var(--bad-soft);color:var(--bad)}
.score b{font-size:1.6em;font-family:var(--f-text);font-variant-numeric:tabular-nums}
.note{font-size:.84em;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.recbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:12px;border:1px dashed var(--line)}
.recbox .lab{font-size:.8em;color:var(--muted);width:100%}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:500}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picopts .opt{padding:6px}
.picopts svg{width:100%;display:block;border-radius:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .opt{min-height:54px;font-size:.92em}
.match .opt.pick{border-color:var(--saffron);background:var(--saffron-soft)}
.match .opt.gone{visibility:hidden}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:12px}
.chunk{padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-text);box-shadow:0 2px 0 var(--line)}
.chunk.used{visibility:hidden}
.typein{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:1.1em}
.typein.ok{border-color:var(--ok)}.typein.no{border-color:var(--bad)}
textarea.typein{height:auto;min-height:110px;padding:12px 14px;line-height:1.5;resize:vertical}
.feedback{padding:12px 14px;border-radius:12px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback small{display:block;font-weight:400;color:var(--ink)}
.dict{font-family:var(--f-text);font-size:1.1em;line-height:1.8}
.dict .ok{color:var(--ok)} .dict .no{color:var(--bad);text-decoration:line-through} .dict .miss{color:var(--bad);border-bottom:2px solid var(--bad)}
.done{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-family:var(--f-text);font-size:2.4em;font-weight:600;color:var(--saffron)}
/* trò chuyện */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.5}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{background:var(--saffron-soft);margin-left:auto;border-bottom-right-radius:4px}
.msg .tr{font-size:.86em;color:var(--muted);margin-top:4px}
.msg .fix{margin-top:8px;font-size:.88em;background:var(--bodhi-soft);border-radius:10px;padding:8px 10px}
.typing{color:var(--muted);font-style:italic}
/* sheet */
#sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:18px 18px 0 0;max-height:86vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .wrap{padding-block:16px 22px;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9em;max-width:calc(100% - 32px);text-align:center}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.hint-toggle{font-size:.84em;color:var(--saffron);font-weight:600}
.occ{display:flex;flex-direction:column;gap:8px}
.occ button{text-align:left;font-family:var(--f-text);padding:10px 12px;border-radius:10px;background:var(--surface2);line-height:1.6}
@media (min-width:560px){.tools{grid-template-columns:repeat(4,1fr)}.badges{grid-template-columns:repeat(8,1fr)}}
</style>

<script type="application/json" id="data">{"rows":[{"id":0,"en":"Thus have I heard: At one time, at the Deer Park, the Buddha preached the Four Noble Truths. After that, the following is what Venerable Sariputta taught in detail about the RIGHT MEDITATIVE ENDEAVOUR.","vi":"Như vầy con đã nghe, một thời tại Lộc Uyển, Thế Tôn thuyết giảng Pháp Tứ Diệu Đế. Sau đó, Tôn giả Xá Lợi Phất giảng giải tường tận về Chánh Tinh Tấn:","s":["Thus have I heard:","At one time, at the Deer Park, the Buddha preached the Four Noble Truths.","After that, the following is what Venerable Sariputta taught in detail about the RIGHT MEDITATIVE ENDEAVOUR."],"w":[[6.9,7.32,7.6,7.84],[8.4,8.64,8.96,9.44,9.64,9.94,10.24,10.72,11.0,11.52,11.88,12.04,12.36,12.8],[13.44,13.96,14.44,14.92,15.4,15.64,15.88,16.92,17.96,18.36,18.6,19.24,19.64,19.88,20.2,21.28]]},{"id":1,"en":"My dear fellows, when Right Livelihood is well established and provides a comfortable living, practitioners should begin to carry on the Right Meditative Endeavour, diligently cultivating meditation to attain spiritual awakening.","vi":"Này đại chúng, khi Chánh Mạng đã thuận lợi, việc nuôi sống bản thân đã ổn định thoải mái, hành giả bắt đầu bước vào Chánh Tinh Tấn, thực hành thiền định nhiếp tâm để chứng đạt tâm linh giác ngộ.","s":["My dear fellows, when Right Livelihood is well established and provides a comfortable living, practitioners should begin to carry on the Right Meditative Endeavour, diligently cultivating meditation to attain spiritual awakening."],"w":[[22.16,22.48,22.8,23.24,23.68,24.12,24.92,25.2,25.48,26.28,26.44,27.08,27.28,28.08,29.04,30.0,30.4,30.96,31.2,31.72,32.0,32.16,32.56,33.64,34.8,35.92,37.0,37.96,38.66,39.37,40.07]]},{"id":2,"en":"Right Meditative Endeavour is the early stage of meditation practice where results have yet to appear. Still, practitioners must clearly understand the entire path of cultivation, just as travelers need a clear and detailed map before a long journey to set out with care and confidence. Progress requires unwavering patience and diligence — this is the true meaning of Right Meditative Endeavour.","vi":"Chánh Tinh Tấn chính là giai đoạn dụng công thiền định ban đầu, chưa có kết quả, nhưng cần phải hiểu rõ toàn bộ lộ trình tu tập, giống như người lữ hành trước hành trình cần bản đồ chi tiết rõ ràng, nắm vững từng chặng đường, từng bước đi một cách cẩn thận. Hành giả không thể có kết quả thiền định nhanh chóng mà phải rất kiên nhẫn đúng như ý nghĩa Tinh Tấn.","s":["Right Meditative Endeavour is the early stage of meditation practice where results have yet to appear.","Still, practitioners must clearly understand the entire path of cultivation, just as travelers need a clear and detailed map before a long journey to set out with care and confidence.","Progress requires unwavering patience and diligence — this is the true meaning of Right Meditative Endeavour."],"w":[[40.78,41.48,42.6,43.36,43.56,43.84,44.36,45.0,45.16,46.12,46.76,47.0,47.6,47.84,48.08,48.5],[48.92,49.6,50.28,50.96,51.56,52.28,52.52,53.08,53.4,53.6,54.76,55.12,55.66,56.2,56.48,56.64,57.04,57.24,57.68,58.12,58.6,58.76,59.12,59.6,59.87,60.13,60.4,60.64,61.0,61.2],[62.24,62.84,64.1,65.36,65.68,66.0,66.32,66.52,66.72,66.92,67.2,67.6,68.08,68.7,69.32,69.94]]},{"id":3,"en":"My dear fellows, there are two complementary paths to meditation: Cessation and Insight. Cessation refers to meditation techniques, while Insight refers to contemplation of doctrine.","vi":"Này đại chúng, có hai con đường dẫn vào thiền định là Chỉ và Quán. Chỉ là kỹ thuật, Quán là đạo lý quán chiếu.","s":["My dear fellows, there are two complementary paths to meditation:","Cessation and Insight.","Cessation refers to meditation techniques, while Insight refers to contemplation of doctrine."],"w":[[70.56,71.36,71.76,72.56,72.8,73.04,73.55,74.06,74.57,75.08],[76.52,77.4,78.0],[78.6,79.34,80.07,80.81,81.54,82.28,82.7,83.12,83.64,83.92,84.96,85.2]]},{"id":4,"en":"Practitioners should sit in the full lotus posture, as all Buddhas have done to attain enlightenment. The posture should be correct: the spine upright, the body relaxed yet still, the legs firmly crossed, the hands gently resting in the lap, palms facing upward with one atop the other, the arms slightly away from the torso, the eyes gently lowered, the mouth closed, and the tongue lightly touching the upper palate.","vi":"Hành giả phải tập ngồi kiết già hoa sen noi theo Mười phương ba đời Chư Phật đã thực hành mà chứng đạo. Hành giả tập ngồi đúng tư thế: lưng thẳng, thân mềm mại mà bất động, hai chân đan vào nhau, hai bàn tay đặt ngửa lên nhau trên chân, hai cánh tay không ép sát thân, mắt nhìn xuống, miệng ngậm, lưỡi đặt lên nướu răng trên nhẹ nhàng.","s":["Practitioners should sit in the full lotus posture, as all Buddhas have done to attain enlightenment.","The posture should be correct: the spine upright, the body relaxed yet still, the legs firmly crossed, the hands gently resting in the lap, palms facing upward with one atop the other, the arms slightly away from the torso, the eyes gently lowered, the mouth closed, and the tongue lightly touching the upper palate."],"w":[[86.1,87.0,88.0,89.0,90.0,90.1,90.19,90.29,90.39,90.49,90.58,90.68,90.88,91.2,91.44,92.04],[93.16,93.44,94.04,94.32,94.64,95.28,95.48,96.0,96.84,97.2,97.72,98.1,98.48,98.96,99.2,99.56,100.04,100.6,100.84,101.16,101.6,102.24,102.48,102.72,103.1,103.48,103.88,104.28,104.68,105.08,105.48,105.8,106.48,106.72,106.96,107.64,108.0,108.28,108.52,109.56,110.06,110.56,111.06,111.56,111.88,112.39,112.89,113.4,113.74,114.08,114.56,115.16,115.48,116.16]]},{"id":5,"en":"This is the practice of Body Stabilization. By maintaining correct posture and keeping the body relaxed yet still, practitioners become more clearly aware of the entire body, allowing the mind to grow more mindful.","vi":"Hành giả tập Điều Thân cho ổn định, nhờ cố gắng giữ thân đúng tư thế, mềm mại và bất động, mà tạo ra cái biết toàn thân giúp tâm được Tỉnh Giác hơn.","s":["This is the practice of Body Stabilization.","By maintaining correct posture and keeping the body relaxed yet still, practitioners become more clearly aware of the entire body, allowing the mind to grow more mindful."],"w":[[116.84,117.16,117.48,117.68,118.32,119.08,119.84],[120.6,121.36,122.24,122.76,123.14,123.52,124.04,124.36,124.84,125.44,125.72,126.36,127.52,128.0,128.24,128.88,129.44,129.64,129.92,130.48,131.24,131.92,132.16,132.56,132.76,133.24,133.52]]},{"id":6,"en":"My dear fellows, when practitioners master the practice of Body Stabilization, they should contemplate the obvious truth: The body is impermanent. It will age, fall ill, and eventually die. After death, it will slowly decay, and even the bones will turn to dust.","vi":"Này đại chúng, khi điều thân thuần thục, hãy quán chiếu một sự thật hiển nhiên: thân này là Vô thường, rồi sẽ già, sẽ bệnh, sẽ chết, sau khi chết thân xác từ từ tan hoại, xương cũng mục thành đất bụi.","s":["My dear fellows, when practitioners master the practice of Body Stabilization, they should contemplate the obvious truth:","The body is impermanent.","It will age, fall ill, and eventually die.","After death, it will slowly decay, and even the bones will turn to dust."],"w":[[134.32,134.6,135.2,135.8,136.4,137.0,137.48,137.72,138.36,138.6,139.88,141.16,141.4,141.72,142.6,142.8,143.64],[144.4,144.68,145.2,146.08],[146.96,147.28,147.56,148.04,148.44,149.12,149.81,150.51],[151.2,151.72,152.32,152.56,152.72,153.36,154.24,154.72,155.06,155.4,155.76,156.0,156.24,156.52]]},{"id":7,"en":"As the mind grows more tranquil and alert, they begin to see clearly: This body is breathing in; this body is breathing out. By observing the breath in this way, the mind becomes more tranquil, and wandering thoughts begin to subside.","vi":"Tâm có chút yên lắng tỉnh giác, hành giả sẽ nhận ra thân này đang thở vào, thân này đang thở ra. Theo dõi hơi thở như thế, tâm sẽ được an lạc hơn, ít vọng tưởng hơn.","s":["As the mind grows more tranquil and alert, they begin to see clearly:","This body is breathing in; this body is breathing out.","By observing the breath in this way, the mind becomes more tranquil, and wandering thoughts begin to subside."],"w":[[157.04,157.32,157.56,157.8,158.12,158.32,158.92,159.44,159.96,160.48,160.96,161.16,161.44],[162.24,162.56,163.12,163.36,163.84,164.32,164.68,165.0,165.45,165.91],[166.36,166.68,167.18,167.68,168.04,168.28,168.52,169.0,169.24,169.6,170.12,170.36,171.08,171.48,172.12,172.52,173.0,173.24]]},{"id":8,"en":"The breath connects Body and Mind, Name and Form. Whoever can govern the breath gains mastery over the inner soul. Breathe in, and know that you are breathing in. Breathe out, and know that you are breathing out. Let this knowing be gentle, without forcing or controlling the breath to be longer, stronger, or deeper than it naturally is.","vi":"Hơi thở là sợi dây kết nối giữa Thân và Tâm, giữa Danh và Sắc. Ai kiểm soát được hơi thở sẽ kiểm soát được nội tâm. Hơi thở vào biết rõ hơi thở vào, hơi thở ra biết rõ hơi thở ra, khéo biết nhưng không dằn ép hay điều khiển hơi thở cho nhiều, cho dài, cho mạnh.","s":["The breath connects Body and Mind, Name and Form.","Whoever can govern the breath gains mastery over the inner soul.","Breathe in, and know that you are breathing in.","Breathe out, and know that you are breathing out.","Let this knowing be gentle, without forcing or controlling the breath to be longer, stronger, or deeper than it naturally is."],"w":[[173.88,174.52,174.96,175.4,175.92,176.2,176.55,176.89,177.24],[177.8,178.48,178.8,179.24,179.68,180.12,180.56,181.0,182.35,183.7,185.05],[186.4,186.83,187.25,187.68,188.04,188.28,188.56,188.8,188.91],[189.02,189.13,189.24,189.35,189.45,189.56,189.67,189.78,189.89],[190.0,190.39,190.77,191.16,191.44,192.2,192.72,193.32,193.56,194.06,194.56,194.78,195.0,195.4,196.28,197.36,197.72,198.28,198.56,198.84,199.8]]},{"id":9,"en":"When practitioners observe the breath in this way, they will discover that the source of wandering thoughts lies not in the head but in the lower abdomen. Focusing attention on the head cannot stop the thoughts; on the contrary, it makes the mind tense and tired.","vi":"Khi theo dõi hơi thở như thế, hành giả nhận ra rằng nguồn xung động của vọng tưởng nằm ở dưới thân chứ không phải trên đầu. Chú ý trên đầu không chặn được vọng tưởng, mà còn khiến tâm trí thêm căng thẳng, mệt mỏi.","s":["When practitioners observe the breath in this way, they will discover that the source of wandering thoughts lies not in the head but in the lower abdomen.","Focusing attention on the head cannot stop the thoughts; on the contrary, it makes the mind tense and tired."],"w":[[200.52,200.84,202.04,202.4,202.76,203.16,203.32,203.64,204.14,204.64,204.92,205.68,205.92,206.12,206.52,206.76,207.21,207.67,208.12,208.57,209.02,209.48,209.93,210.38,210.83,211.28,211.74],[212.19,212.64,213.32,213.44,213.6,213.88,214.32,214.68,215.06,215.44,215.68,215.92,216.88,217.2,217.6,218.0,218.4,218.8,219.2]]},{"id":10,"en":"There are many other truths that we should gradually contemplate to break false attachments. For instance, practitioners reflect: This world is impermanent, like a dream, full of conflicts and suffering.","vi":"Còn nhiều sự thật cần quán chiếu dần để gột bỏ lầm chấp. Chẳng hạn như, hành giả quán chiếu: Thế gian này vô thường, hư ảo, đầy rẫy ngang trái và khổ đau.","s":["There are many other truths that we should gradually contemplate to break false attachments.","For instance, practitioners reflect:","This world is impermanent, like a dream, full of conflicts and suffering."],"w":[[219.6,219.88,220.2,220.72,221.04,221.56,221.76,222.0,222.28,223.04,223.84,224.04,224.67,225.29],[225.92,226.24,227.18,228.12],[229.08,229.44,229.76,230.48,231.2,231.48,231.72,232.28,232.56,232.98,233.4,233.64]]},{"id":11,"en":"My dear fellows, greed, anger, jealousy, arrogance, and irresponsibility are unwholesome states of mind that trap beings in endless suffering and darkness. Simply being aware that the mind is burning with pride, selfishness, greed, anger, jealousy, or irresponsibility will, over time, cause them to fade away.","vi":"Này đại chúng, tham lam, sân hận, đố kỵ, kiêu mạn, vô trách nhiệm là những tâm bất thiện khiến chúng sinh mãi chìm trong tăm tối. Chỉ cần BIẾT rằng trong tâm này đang bị thiêu đốt bởi kiêu mạn, ích kỷ, tham lam, sân hận, đố kỵ, vô trách nhiệm… thì tự nhiên lâu ngày các tâm bất thiện đó sẽ mất dần.","s":["My dear fellows, greed, anger, jealousy, arrogance, and irresponsibility are unwholesome states of mind that trap beings in endless suffering and darkness.","Simply being aware that the mind is burning with pride, selfishness, greed, anger, jealousy, or irresponsibility will, over time, cause them to fade away."],"w":[[234.8,235.2,235.52,236.28,236.92,237.8,238.9,240.0,240.24,242.08,242.28,243.04,243.44,243.6,243.88,244.16,244.44,244.92,245.12,245.68,246.24,246.48],[247.36,248.08,248.64,249.16,249.32,249.56,249.92,250.16,250.64,250.92,251.6,252.72,253.08,253.52,254.4,255.36,256.32,256.8,257.28,257.76,258.16,258.4,258.64,259.08]]},{"id":12,"en":"As awareness strengthens, practitioners skillfully guide the breath to become SLOW, LITTLE, AND GENTLE — no longer abundant, heavy, or rapid. As it becomes softer and more subtle, both the body and mind naturally grow still and calm.","vi":"Khi có thêm sức tỉnh giác, hành giả sẽ khéo léo giữ cho hơi thở CHẬM - ÍT - ÊM, chứ không còn thở nhiều, thở mạnh, thở nhanh. Khi Hơi thở êm dịu nhỏ nhiệm thì Thân thể và Tâm thức cũng yên tĩnh dần.","s":["As awareness strengthens, practitioners skillfully guide the breath to become SLOW, LITTLE, AND GENTLE — no longer abundant, heavy, or rapid.","As it becomes softer and more subtle, both the body and mind naturally grow still and calm."],"w":[[259.92,260.46,261.0,261.66,262.33,262.99,263.66,264.32,264.68,264.96,265.64,266.28,266.96,267.28,267.96,268.14,268.32,268.92,270.0,270.44,270.68],[271.36,271.72,271.96,272.52,273.04,273.28,273.52,274.24,274.64,274.88,275.36,275.6,275.92,276.64,276.96,277.32,277.56]]},{"id":13,"en":"When practitioners skillfully maintain a slow, little, and gentle breath, there comes a moment when they suddenly find the right volume of breath, where the breath seems to “stick” to the mind. The breath and mind are bound together, giving practitioners a firm anchor amidst the inner storm — just like someone holding onto a solid pillar amidst a windstorm, remaining steady and unswept.","vi":"Sau khi khéo léo giữ hơi thở CHẬM - ÍT - ÊM, lúc nào đó, bất ngờ hành giả tìm thấy hơi thở có cường độ vừa đủ để DÍNH VỚI TÂM. Tâm và hơi thở theo nhau, hành giả có một trụ cột vững chắc giữa sóng gió nội tâm. Giống như một người giữa cơn bão tố nhờ có trụ cột để nắm giữ mà không bị giông bão cuốn đi.","s":["When practitioners skillfully maintain a slow, little, and gentle breath, there comes a moment when they suddenly find the right volume of breath, where the breath seems to “stick” to the mind.","The breath and mind are bound together, giving practitioners a firm anchor amidst the inner storm — just like someone holding onto a solid pillar amidst a windstorm, remaining steady and unswept."],"w":[[279.6,279.96,280.92,281.88,282.48,282.64,283.28,284.0,284.24,284.62,285.0,285.72,286.2,286.4,286.88,287.16,287.44,288.16,288.52,288.68,289.0,289.56,289.76,290.28,290.52,290.72,291.08,291.36,291.52,291.92,292.12,292.4],[292.88,293.08,293.48,293.64,294.0,294.2,294.56,295.54,296.52,297.68,297.8,298.24,298.68,299.24,299.66,300.08,300.64,300.8,300.96,301.28,301.8,302.4,302.8,303.08,303.64,304.2,304.72,305.32,305.92,306.72,307.32,308.14]]},{"id":14,"en":"There is a point on the body that the ancient scriptures call Kanda, located about six centimetres below the navel, on the skin's surface. This point is invisible and carries no specific physical sensation; its location can be discerned only through wisdom. By persistently anchoring the mind at Kanda, wandering thoughts gradually gather in one place. It is like gathering scattered debris into a single pile, or tethering a boat, once swept away by wind and waves, firmly to a post on the shore.\nPractitioners remain aware of arising thoughts but are no longer carried away by them. As the mind rests at Kanda, at first it may still be restless, but it gradually settles into deep stillness. This is the gateway to meditative absorption.\nIn ancient times, when the Buddha was twelve years old, He also anchored His mind at Kanda and entered the First Jhana.","vi":"Có một điểm nơi cơ thể mà kinh xưa gọi là Kanda, nằm ở vị trí khoảng sáu phân dưới rốn, trên bề mặt da. Điểm này vô hình, không có một cảm giác cụ thể, chỉ được định vị bằng trí tuệ. Kiên trì an trú tâm nơi Kanda, vọng tưởng dần dần được thu nhiếp về một chỗ. Cũng như rác vương vãi khắp nơi nay được gom lại một chỗ; cũng như chiếc thuyền bị sóng gió cuốn ra biển khơi nay được neo vào một cọc vững chắc trên bờ.\nHành giả biết mình đang vọng tưởng, nhưng không còn bị cuốn trôi miên man theo vọng tưởng. Khi an trú tâm nơi Kanda, ban đầu tâm vẫn còn lăng xăng, nhưng dần dần sẽ trở nên yên lắng sâu xa. Đây là cánh cửa đưa hành giả đi vào thiền định.\nNgày xưa, khi lên mười hai tuổi, Đức Phật cũng an trú tâm nơi Kanda mà nhập Sơ thiền.","s":["There is a point on the body that the ancient scriptures call Kanda, located about six centimetres below the navel, on the skin's surface.","This point is invisible and carries no specific physical sensation; its location can be discerned only through wisdom.","By persistently anchoring the mind at Kanda, wandering thoughts gradually gather in one place.","It is like gathering scattered debris into a single pile, or tethering a boat, once swept away by wind and waves, firmly to a post on the shore.","Practitioners remain aware of arising thoughts but are no longer carried away by them.","As the mind rests at Kanda, at first it may still be restless, but it gradually settles into deep stillness.","This is the gateway to meditative absorption.","In ancient times, when the Buddha was twelve years old, He also anchored His mind at Kanda and entered the First Jhana."],"w":[[308.96,309.36,309.64,309.88,310.24,310.44,310.72,311.24,311.44,311.68,312.16,312.76,313.04,313.8,314.4,315.0,315.74,316.48,317.0,317.24,318.0,318.27,318.53,318.8],[319.52,319.84,320.2,320.48,321.56,321.88,322.4,322.68,323.44,324.24,325.2,325.6,326.32,326.6,326.92,327.52,327.88,328.2],[328.92,329.58,330.24,330.96,331.2,331.52,332.0,332.48,333.28,333.64,334.4,334.88,335.12,335.52],[336.16,336.48,336.72,337.04,337.66,338.28,338.88,339.28,339.52,340.16,340.88,341.16,341.65,342.14,342.63,343.12,343.68,344.08,344.39,344.69,345.0,345.8,346.36,346.66,346.96,347.52,347.76,348.0],[352.56,354.04,354.56,355.12,355.51,355.9,356.29,356.68,356.88,357.16,357.64,358.28,358.68,359.04],[359.64,360.0,360.34,360.67,361.01,361.34,361.68,362.0,362.36,362.6,362.84,363.16,363.4,364.32,364.64,364.96,365.76,366.36,366.72,367.08],[368.48,368.8,369.1,369.4,369.92,370.24,371.28],[372.56,372.96,373.64,374.16,374.4,374.74,375.08,375.36,375.8,376.12,376.48,376.8,377.24,377.88,378.08,378.4,378.78,379.16,379.4,379.88,380.08,380.58]]},{"id":15,"en":"The highest technique in meditation is when practitioners find the precise volume of breath where the breath “sticks” to the mind. Once this breath volume is found, just following the breath means controlling the mind. Do not try to control the mind directly, as doing so may lead to tension or even illness.","vi":"Kỹ thuật đỉnh cao của Thiền chính là khi tìm được HƠI THỞ DÍNH VỚI TÂM. Từ đó chỉ theo dõi hơi thở tức là đã kiểm soát được tâm. Đừng cố tìm cách trực tiếp kiểm soát tâm kẻo sinh nhiều bệnh tật.","s":["The highest technique in meditation is when practitioners find the precise volume of breath where the breath “sticks” to the mind.","Once this breath volume is found, just following the breath means controlling the mind.","Do not try to control the mind directly, as doing so may lead to tension or even illness."],"w":[[381.08,381.4,381.92,382.56,382.84,383.76,384.04,384.28,385.4,385.68,385.88,386.44,386.96,387.12,387.42,387.72,388.0,388.28,388.56,388.8,389.18],[389.56,389.78,390.0,390.4,391.0,391.28,392.08,392.44,393.12,393.44,393.76,394.08,394.63,395.17],[395.72,396.04,396.32,396.6,396.88,397.26,397.64,398.0,398.92,399.24,399.68,399.95,400.21,400.48,400.92,401.36,401.64,402.12]]},{"id":16,"en":"However, as the mind grows still and joyful feelings arise, practitioners may fall into self-praise and pride. This kind of pride is subtle but dangerous.","vi":"Nhưng khi tâm có vẻ yên lắng, hỷ lạc xuất hiện, dễ khởi tâm lý tự khen làm phát sinh kiêu mạn, nguy hiểm vô cùng.","s":["However, as the mind grows still and joyful feelings arise, practitioners may fall into self-praise and pride.","This kind of pride is subtle but dangerous."],"w":[[403.2,404.16,404.44,404.68,404.92,405.16,405.44,405.64,406.16,406.8,407.78,408.76,409.04,409.4,409.72,410.44,410.64],[411.28,411.64,411.92,412.12,412.52,412.68,413.24,414.52]]},{"id":17,"en":"Dwelling in awareness of the entire body is a technique of Cessation, but it must be paired with Insight. When the awareness of the body becomes clear, they must immediately reflect on the impermanence of the body.","vi":"An trú toàn thân là Kỹ thuật (Chỉ), hành giả cần đạo lý quán chiếu bổ sung. Khi toàn thân hiện ra rõ ràng, phải nhanh chóng tác ý Quán Thân Vô Thường, đừng chỉ an trú toàn thân mà đã cho là đủ.","s":["Dwelling in awareness of the entire body is a technique of Cessation, but it must be paired with Insight.","When the awareness of the body becomes clear, they must immediately reflect on the impermanence of the body."],"w":[[415.8,416.68,417.22,417.76,418.0,418.2,419.0,419.56,419.84,420.08,420.64,420.8,421.76,422.16,422.4,422.64,422.94,423.24,423.82],[424.4,424.72,425.0,425.88,426.04,426.32,426.8,427.4,428.08,428.36,428.68,429.68,430.32,430.52,430.8,431.84,431.96,432.2]]},{"id":18,"en":"The practice of Cessation alone cannot uproot deep-seated ignorance or ego-clinging. Only through Insight meditation can practitioners attain absolute Enlightenment.","vi":"Phép Chỉ, kỹ thuật nhiếp tâm không giúp gạn lọc hết vô minh chấp ngã, phải nhờ phép Quán để đạt đến viên mãn giác ngộ.","s":["The practice of Cessation alone cannot uproot deep-seated ignorance or ego-clinging.","Only through Insight meditation can practitioners attain absolute Enlightenment."],"w":[[434.36,434.8,435.24,435.48,436.24,436.8,437.36,437.84,438.68,439.16,439.64],[441.16,441.64,442.14,442.64,443.52,443.8,444.92,445.4,446.28]]},{"id":19,"en":"We must be brave to face the truths of aging, sickness, and death, even while we are still young and well, so that we can let go of trivial worldly desires. As long as we are still alive and healthy, we must treasure our time, doing good deeds and practicing the Dharma diligently. Do not waste this precious human life on meaningless things.","vi":"Phải can đảm đối diện với già, bệnh, chết ngay khi còn khỏe mạnh, để buông bỏ những ham muốn tầm thường. Ngày nào còn khỏe, còn sống, phải biết quý thời gian để làm điều thiện, tu hành, chớ uổng phí kiếp người vô nghĩa.","s":["We must be brave to face the truths of aging, sickness, and death, even while we are still young and well, so that we can let go of trivial worldly desires.","As long as we are still alive and healthy, we must treasure our time, doing good deeds and practicing the Dharma diligently.","Do not waste this precious human life on meaningless things."],"w":[[447.4,447.68,447.96,448.2,448.52,448.76,449.04,449.36,449.68,450.1,450.52,451.2,451.44,452.0,452.4,452.72,453.0,453.2,453.52,453.88,454.12,454.64,455.0,455.28,455.56,455.88,456.12,456.44,456.64,457.44,458.0],[458.96,459.24,459.52,459.76,460.04,460.28,460.64,461.12,461.36,462.08,462.36,462.64,463.24,463.52,465.04,465.32,465.72,466.12,466.52,466.92,467.32,467.72],[468.92,469.24,469.52,469.88,470.12,470.68,471.12,471.4,471.72,472.48]]},{"id":20,"en":"The next truth to contemplate is that the body is unclean by nature. The body should be regarded simply as a tool for doing good and practicing the Dharma, not as an object for pursuing selfish pleasure.","vi":"Sự thật tiếp theo, Thân vốn bất tịnh. Hành giả chỉ dùng thân để làm việc thiện và tu hành.","s":["The next truth to contemplate is that the body is unclean by nature.","The body should be regarded simply as a tool for doing good and practicing the Dharma, not as an object for pursuing selfish pleasure."],"w":[[472.96,473.2,473.52,473.8,474.08,475.08,475.36,475.6,475.88,476.44,476.72,477.48,477.8],[478.64,479.04,479.56,479.88,480.4,480.92,481.52,481.76,481.96,482.48,482.72,483.28,483.56,484.12,484.68,485.1,485.52,486.0,486.24,486.48,487.0,487.24,488.0,488.64]]},{"id":21,"en":"This body is also the result of karma through countless lifetimes. Practitioners must learn to see this body as a mass of sins accumulated from countless past lives.","vi":"Thân này cũng là Kết tinh của Nghiệp từ vô lượng kiếp. Hành giả phải thấy thân cũng là Khối Tội từ vô lượng kiếp.","s":["This body is also the result of karma through countless lifetimes.","Practitioners must learn to see this body as a mass of sins accumulated from countless past lives."],"w":[[489.6,490.12,490.76,491.04,491.44,491.76,492.36,492.7,493.04,493.32,493.88],[494.74,495.6,495.88,496.16,496.36,496.68,496.96,497.48,497.72,497.88,498.28,498.44,498.84,500.04,500.28,500.84,501.14]]},{"id":22,"en":"This body carries a powerful instinctual fetter: the craving for life and the fear of death. In truth, this body is a burden.","vi":"Thân này mang một kiết sử bản năng mãnh liệt là ham sống sợ chết. Thân này thật là gánh nặng.","s":["This body carries a powerful instinctual fetter: the craving for life and the fear of death.","In truth, this body is a burden."],"w":[[501.44,501.72,502.16,502.76,503.04,503.76,504.6,505.44,505.72,506.36,506.68,507.0,507.2,507.4,507.84,508.04],[508.64,508.96,509.52,509.96,510.4,510.68,510.92]]},{"id":23,"en":"Even when the mind becomes deeply still and alert, practitioners must contemplate the ultimate truth: this peaceful state is still bound by ignorance and sins. Unless one attains absolute Enlightenment, with the Three Knowledges and the Six Supernatural Powers, ignorance and sins remain. Practitioners must engrave this ultimate truth into their hearts until the day of full liberation is reached.","vi":"Khi tâm tỉnh giác yên tĩnh, phải quán chiếu sâu xa đến sự thật cuối cùng: Trạng thái này vẫn còn là Vô Minh và Tội Lỗi. Chừng nào chưa đạt Tam Minh Lục Thông, chừng đó vẫn còn Vô minh và Tội lỗi. Hành giả phải ghi xương khắc cốt sự thật cuối cùng này cho đến ngày hoàn toàn giải thoát.","s":["Even when the mind becomes deeply still and alert, practitioners must contemplate the ultimate truth: this peaceful state is still bound by ignorance and sins.","Unless one attains absolute Enlightenment, with the Three Knowledges and the Six Supernatural Powers, ignorance and sins remain.","Practitioners must engrave this ultimate truth into their hearts until the day of full liberation is reached."],"w":[[513.28,513.96,514.24,514.48,514.88,515.36,515.88,516.24,516.66,517.08,518.32,518.56,519.36,519.86,520.36,520.8,521.12,521.64,522.04,522.2,522.48,522.84,523.08,523.84,524.31],[524.77,525.24,525.52,526.0,526.84,527.8,528.0,528.24,528.7,529.16,529.36,529.56,529.92,531.24,532.04,532.49,532.95,533.4],[534.04,535.16,535.48,535.97,536.47,536.96,537.4,537.8,538.04,538.48,538.8,539.12,539.38,539.64,540.3,540.96,541.28]]},{"id":24,"en":"The more they progress, the deeper the contemplation must be. Such reflections prevent pride from arising, protect the virtue of humility, and gradually guide practitioners towards complete Non-self.","vi":"Sự tiến bộ tới đâu thì sự quán chiếu cũng phải đi theo tới đó để kiềm giữ không cho kiêu mạn trỗi dậy, để giữ gìn đức hạnh hiền lành, để hướng về Vô ngã trọn vẹn.","s":["The more they progress, the deeper the contemplation must be.","Such reflections prevent pride from arising, protect the virtue of humility, and gradually guide practitioners towards complete Non-self."],"w":[[542.0,542.24,542.56,542.84,543.6,543.88,544.4,544.64,545.68,546.0],[546.44,546.76,547.6,548.12,548.64,549.16,549.68,550.24,550.48,551.08,551.28,552.44,552.8,553.48,554.16,554.84,555.52,556.09]]},{"id":25,"en":"My dear fellows, outside of sitting meditation, in every moment of daily life, practitioners should constantly reflect: “This body is impermanent and sinful. This self is a mass of ignorance and sins.” Whether awake or asleep, working or resting, do not let even a single moment pass without contemplation.","vi":"Này đại chúng, ngoài lúc tọa thiền, mỗi khoảnh khắc thời gian đều quán Thân này Vô Thường Tội Lỗi, Chính mình chỉ là Vô Minh Tội Lỗi. Dù thức hay ngủ, làm việc hay nghỉ ngơi, không phút giây nào buông lơi quán chiếu.","s":["My dear fellows, outside of sitting meditation, in every moment of daily life, practitioners should constantly reflect:","“This body is impermanent and sinful.","This self is a mass of ignorance and sins.”","Whether awake or asleep, working or resting, do not let even a single moment pass without contemplation."],"w":[[557.24,557.56,557.88,558.68,559.12,559.56,560.0,561.48,561.84,562.36,562.92,563.16,563.75,564.33,564.92,565.16,566.0],[566.8,567.08,567.68,568.3,568.92,569.16],[569.58,570.0,570.44,570.68,570.92,571.28,571.56,572.28,572.56],[573.48,574.12,574.72,574.92,575.68,576.2,576.44,577.16,577.48,577.8,578.12,578.6,578.8,579.36,579.88,580.24,580.68]]},{"id":26,"en":"Those who do not yet have the karmic conditions for Enlightenment must walk a more difficult path. Their spiritual path is full of challenges and requires their practice to be diligent, thorough and precise, even in the smallest details.","vi":"Người không có duyên mặc định sẽ đắc đạo, đường tu vất vả gian lao, phải siêng dụng công kỹ lưỡng đầy đủ, chính xác từng chi tiết nhỏ, mới không bị tai hại, bệnh tật.","s":["Those who do not yet have the karmic conditions for Enlightenment must walk a more difficult path.","Their spiritual path is full of challenges and requires their practice to be diligent, thorough and precise, even in the smallest details."],"w":[[582.72,583.24,583.52,583.76,584.08,584.44,584.68,585.08,585.48,586.28,586.52,587.56,587.84,588.12,588.32,588.64,589.44],[589.76,590.08,590.92,591.32,591.52,591.8,591.96,592.8,593.04,593.6,593.8,594.4,594.64,594.96,595.8,596.52,596.76,597.56,598.08,598.32,598.6,599.58]]},{"id":27,"en":"My dear fellows, merit is an essential foundation for meditation practice. Even with the right effort and proper technique, without sufficient merit, one still cannot enter deep stillness in meditation.","vi":"Này đại chúng, Công Đức Lành là yếu tố quan trọng trong việc tu thiền. Dù có nỗ lực hay có phương pháp đúng, nhưng thiếu công đức lành, thiền định vẫn không thể thành tựu.","s":["My dear fellows, merit is an essential foundation for meditation practice.","Even with the right effort and proper technique, without sufficient merit, one still cannot enter deep stillness in meditation."],"w":[[600.56,601.12,601.48,602.32,602.92,603.2,603.44,604.16,604.88,605.2,606.16],[607.04,607.52,607.76,608.0,608.4,608.92,609.16,609.6,610.48,610.96,611.76,612.26,612.76,613.08,613.64,614.08,614.4,615.27,616.13]]},{"id":28,"en":"There are two kinds of merit that practitioners must continuously cultivate: first, reverence toward the Perfectly Enlightened Ones, and second, the effort to guide sentient beings in their spiritual practice toward Enlightenment.","vi":"Có hai công đức mà hành giả phải vun đắp mãi mãi là: Tôn kính bậc A La Hán Chánh Đẳng Giác, và Độ cho chúng sinh tu hành chứng ngộ.","s":["There are two kinds of merit that practitioners must continuously cultivate: first, reverence toward the Perfectly Enlightened Ones, and second, the effort to guide sentient beings in their spiritual practice toward Enlightenment."],"w":[[617.0,617.48,617.76,618.04,618.44,618.64,619.16,619.4,620.48,620.8,621.92,623.04,623.4,624.2,624.64,624.92,625.8,626.56,627.24,627.52,628.12,628.5,628.89,629.27,629.66,630.04,630.8,631.0,631.24,632.04,632.64,633.84]]},{"id":29,"en":"When the mind grows still, practitioners may feel an urge to let go of everything, which can lead to indifference or a sense of irresponsibility toward other beings. No matter how still or peaceful the mind becomes, the vow to help all beings must remain unshaken, and the sense of responsibility for all beings must never fade.","vi":"Khi tâm trở nên yên tĩnh, hành giả dễ khởi ý nghĩ từ bỏ tất cả, nên trở thành vô trách nhiệm với chúng sinh. Dù tâm có yên tĩnh, nhưng hạnh nguyện độ sinh không bao giờ chấm dứt, trách nhiệm với chúng sinh không bao giờ vơi cạn.","s":["When the mind grows still, practitioners may feel an urge to let go of everything, which can lead to indifference or a sense of irresponsibility toward other beings.","No matter how still or peaceful the mind becomes, the vow to help all beings must remain unshaken, and the sense of responsibility for all beings must never fade."],"w":[[635.04,635.44,635.68,636.0,636.36,637.12,637.88,638.16,638.42,638.68,639.0,639.2,639.48,639.72,639.92,640.92,641.2,641.52,641.84,642.16,642.79,643.41,644.04,644.67,645.29,645.92,646.52,647.04],[648.2,648.52,649.0,649.32,649.68,649.88,650.28,650.68,651.0,651.88,652.12,652.44,652.72,653.12,653.32,653.84,654.12,654.64,655.56,655.8,656.04,656.48,656.68,658.28,658.56,658.88,659.4,659.68,660.42]]},{"id":30,"en":"My dear fellows, only those with great merit can constantly remember: This self is still full of ignorance and sins. Therefore, practitioners must frequently bow in reverence to the Perfectly Enlightened Ones and earnestly repent for unwholesome karma from the past.","vi":"Này đại chúng, phải có công đức lành rất nhiều, một người mới có thể thường xuyên nhớ mình là Vô Minh Tội Lỗi. Hành giả phải thường lễ kính các bậc A La Hán Chánh Đẳng Giác để xin sám hối các nghiệp bất thiện từ quá khứ.","s":["My dear fellows, only those with great merit can constantly remember:","This self is still full of ignorance and sins.","Therefore, practitioners must frequently bow in reverence to the Perfectly Enlightened Ones and earnestly repent for unwholesome karma from the past."],"w":[[661.16,662.16,662.52,663.4,663.8,664.16,664.4,664.68,665.2,665.44,666.2],[667.2,667.52,667.88,668.04,668.4,668.68,668.96,669.68,669.92],[670.44,671.0,672.04,672.32,673.04,673.44,673.64,674.4,674.68,675.08,675.8,676.6,677.24,677.56,678.4,678.92,679.2,679.84,680.48,680.8,681.42]]},{"id":31,"en":"When practitioners constantly contemplate “This self is but ignorance and sins”, a deep and sincere humility arises. They then no longer desire lofty spiritual attainments but merely wish to always remember this truth for the rest of their lives.","vi":"Khi luôn nhớ mình chỉ là Vô minh Tội lỗi, hành giả sẽ cảm nhận rằng suốt đời chỉ mong được nhớ chính mình là Vô minh Tội lỗi, chứ không còn mong chứng ngộ cao siêu.","s":["When practitioners constantly contemplate “This self is but ignorance and sins”, a deep and sincere humility arises.","They then no longer desire lofty spiritual attainments but merely wish to always remember this truth for the rest of their lives."],"w":[[682.04,682.28,683.4,683.86,684.32,684.78,685.24,685.7,686.16,686.84,687.14,687.44,687.6,687.92,688.12,688.92,690.08],[691.36,691.76,692.12,692.44,692.96,693.64,694.16,695.08,695.8,696.04,696.56,696.84,697.16,697.6,698.32,698.64,698.94,699.24,699.44,699.8,700.04,700.32]]},{"id":32,"en":"We bow in deep reverence to the Compassionate Buddha. May the Buddha bless us to forever remember the sacred words of the Sutra of Right Meditative Endeavour, a noble truth proclaimed by all Buddhas. We bow in deep gratitude to Venerable Sariputta, the One foremost in wisdom, who compassionately explained these profound teachings, guiding us steadily on the path of liberation. May all sentient beings develop unshakable determination, steadily accumulate infinite merit, diligently practice meditation in the right way, and forever follow the Buddha toward the entire Enlightenment.","vi":"Cúi lạy Phật từ bi gia hộ cho chúng con mãi mãi khắc ghi lời Kinh Chánh Tinh Tấn nhiệm màu, chân lý cao quý mà Chư Phật Mười Phương Ba Đời đều tuyên thuyết. Cúi lạy Ngài Xá Lợi Phất, bậc Đệ Nhất Trí Tuệ đã từ bi giảng giải nghĩa lý thâm sâu, dẫn dắt chúng con vững bước trên con đường giải thoát. Nguyện tất cả chúng sinh thành tựu ý chí kiên định phi thường, từng bước gây tạo vô lượng công đức, tinh tấn thực hành thiền định đúng phương pháp, mãi theo Phật đến bờ giác vô biên.","s":["We bow in deep reverence to the Compassionate Buddha.","May the Buddha bless us to forever remember the sacred words of the Sutra of Right Meditative Endeavour, a noble truth proclaimed by all Buddhas.","We bow in deep gratitude to Venerable Sariputta, the One foremost in wisdom, who compassionately explained these profound teachings, guiding us steadily on the path of liberation.","May all sentient beings develop unshakable determination, steadily accumulate infinite merit, diligently practice meditation in the right way, and forever follow the Buddha toward the entire Enlightenment."],"w":[[702.0,702.32,702.64,702.88,703.2,703.72,703.96,704.62,705.28],[705.8,706.32,706.84,707.36,707.68,708.11,708.53,708.96,709.72,710.0,710.6,710.96,711.12,711.32,711.92,712.12,712.81,713.51,714.2,714.44,714.92,715.42,715.92,716.39,716.85],[717.32,717.64,717.96,718.2,718.52,719.28,719.86,720.44,721.02,721.6,721.88,722.48,722.68,723.24,723.52,724.56,725.6,726.12,726.84,727.48,728.0,728.24,729.12,729.36,729.6,730.12,730.4],[731.68,732.0,732.4,733.04,733.56,734.6,735.64,736.68,737.48,738.52,739.24,740.0,740.82,741.64,742.68,742.92,743.16,743.56,744.12,744.44,745.32,745.8,746.08,746.64,747.16,747.4,748.0]]},{"id":33,"en":"NAMO THE FOREMOST WISDOM VENERABLE SARIPUTTA, LEADER OF THE SANGHA","vi":"NAM MÔ ĐỆ NHẤT TRÍ TUỆ THỐNG LĨNH TĂNG ĐOÀN XÁ LỢI PHẤT TÔN GIẢ","s":["NAMO THE FOREMOST WISDOM VENERABLE SARIPUTTA, L
