"4":[{"en":[0],"vi":"Hành giả phải tập ngồi kiết già hoa sen noi theo Mười phương ba đời Chư Phật đã thực hành mà chứng đạo."},{"en":[1],"vi":"Hành giả tập ngồi đúng tư thế: lưng thẳng, thân mềm mại mà bất động, hai chân đan vào nhau, hai bàn tay đặt ngửa lên nhau trên chân, hai cánh tay không ép sát thân, mắt nhìn xuống, miệng ngậm, lưỡi đặt lên nướu răng trên nhẹ nhàng."}],"5":[{"en":[0,1],"vi":"Hành giả tập Điều Thân cho ổn định, nhờ cố gắng giữ thân đúng tư thế, mềm mại và bất động, mà tạo ra cái biết toàn thân giúp tâm được Tỉnh Giác hơn."}],"6":[{"en":[0],"vi":"Này đại chúng, khi điều thân thuần thục, hãy quán chiếu một sự thật hiển nhiên:"},{"en":[1],"vi":"thân này là Vô thường,"},{"en":[2],"vi":"rồi sẽ già, sẽ bệnh, sẽ chết,"},{"en":[3],"vi":"sau khi chết thân xác từ từ tan hoại, xương cũng mục thành đất bụi."}],"7":[{"en":[0,1],"vi":"Tâm có chút yên lắng tỉnh giác, hành giả sẽ nhận ra thân này đang thở vào, thân này đang thở ra."},{"en":[2],"vi":"Theo dõi hơi thở như thế, tâm sẽ được an lạc hơn, ít vọng tưởng hơn."}],"8":[{"en":[0],"vi":"Hơi thở là sợi dây kết nối giữa Thân và Tâm, giữa Danh và Sắc."},{"en":[1],"vi":"Ai kiểm soát được hơi thở sẽ kiểm soát được nội tâm."},{"en":[2],"vi":"Hơi thở vào biết rõ hơi thở vào,"},{"en":[3],"vi":"hơi thở ra biết rõ hơi thở ra,"},{"en":[4],"vi":"khéo biết nhưng không dằn ép hay điều khiển hơi thở cho nhiều, cho dài, cho mạnh."}],"9":[{"en":[0],"vi":"Khi theo dõi hơi thở như thế, hành giả nhận ra rằng nguồn xung động của vọng tưởng nằm ở dưới thân chứ không phải trên đầu."},{"en":[1],"vi":"Chú ý trên đầu không chặn được vọng tưởng, mà còn khiến tâm trí thêm căng thẳng, mệt mỏi."}],"10":[{"en":[0],"vi":"Còn nhiều sự thật cần quán chiếu dần để gột bỏ lầm chấp."},{"en":[1],"vi":"Chẳng hạn như, hành giả quán chiếu:"},{"en":[2],"vi":"Thế gian này vô thường, hư ảo, đầy rẫy ngang trái và khổ đau."}],"11":[{"en":[0],"vi":"Này đại chúng, tham lam, sân hận, đố kỵ, kiêu mạn, vô trách nhiệm là những tâm bất thiện khiến chúng sinh mãi chìm trong tăm tối."},{"en":[1],"vi":"Chỉ cần BIẾT rằng trong tâm này đang bị thiêu đốt bởi kiêu mạn, ích kỷ, tham lam, sân hận, đố kỵ, vô trách nhiệm… thì tự nhiên lâu ngày các tâm bất thiện đó sẽ mất dần."}],"12":[{"en":[0],"vi":"Khi có thêm sức tỉnh giác, hành giả sẽ khéo léo giữ cho hơi thở CHẬM - ÍT - ÊM, chứ không còn thở nhiều, thở mạnh, thở nhanh."},{"en":[1],"vi":"Khi Hơi thở êm dịu nhỏ nhiệm thì Thân thể và Tâm thức cũng yên tĩnh dần."}],"13":[{"en":[0],"vi":"Sau khi khéo léo giữ hơi thở CHẬM - ÍT - ÊM, lúc nào đó, bất ngờ hành giả tìm thấy hơi thở có cường độ vừa đủ để DÍNH VỚI TÂM."},{"en":[1],"vi":"Tâm và hơi thở theo nhau, hành giả có một trụ cột vững chắc giữa sóng gió nội tâm. Giống như một người giữa cơn bão tố nhờ có trụ cột để nắm giữ mà không bị giông bão cuốn đi."}],"14":[{"en":[0],"vi":"Có một điểm nơi cơ thể mà kinh xưa gọi là Kanda, nằm ở vị trí khoảng sáu phân dưới rốn, trên bề mặt da."},{"en":[1],"vi":"Điểm này vô hình, không có một cảm giác cụ thể, chỉ được định vị bằng trí tuệ."},{"en":[2],"vi":"Kiên trì an trú tâm nơi Kanda, vọng tưởng dần dần được thu nhiếp về một chỗ."},{"en":[3],"vi":"Cũng như rác vương vãi khắp nơi nay được gom lại một chỗ; cũng như chiếc thuyền bị sóng gió cuốn ra biển khơi nay được neo vào một cọc vững chắc trên bờ."},{"en":[4],"vi":"Hành giả biết mình đang vọng tưởng, nhưng không còn bị cuốn trôi miên man theo vọng tưởng."},{"en":[5],"vi":"Khi an trú tâm nơi Kanda, ban đầu tâm vẫn còn lăng xăng, nhưng dần dần sẽ trở nên yên lắng sâu xa."},{"en":[6],"vi":"Đây là cánh cửa đưa hành giả đi vào thiền định."},{"en":[7],"vi":"Ngày xưa, khi lên mười hai tuổi, Đức Phật cũng an trú tâm nơi Kanda mà nhập Sơ thiền."}],"15":[{"en":[0],"vi":"Kỹ thuật đỉnh cao của Thiền chính là khi tìm được HƠI THỞ DÍNH VỚI TÂM."},{"en":[1],"vi":"Từ đó chỉ theo dõi hơi thở tức là đã kiểm soát được tâm."},{"en":[2],"vi":"Đừng cố tìm cách trực tiếp kiểm soát tâm kẻo sinh nhiều bệnh tật."}],"16":[{"en":[0,1],"vi":"Nhưng khi tâm có vẻ yên lắng, hỷ lạc xuất hiện, dễ khởi tâm lý tự khen làm phát sinh kiêu mạn, nguy hiểm vô cùng."}],"17":[{"en":[0],"vi":"An trú toàn thân là Kỹ thuật (Chỉ), hành giả cần đạo lý quán chiếu bổ sung."},{"en":[1],"vi":"Khi toàn thân hiện ra rõ ràng, phải nhanh chóng tác ý Quán Thân Vô Thường, đừng chỉ an trú toàn thân mà đã cho là đủ."}],"18":[{"en":[0],"vi":"Phép Chỉ, kỹ thuật nhiếp tâm không giúp gạn lọc hết vô minh chấp ngã,"},{"en":[1],"vi":"phải nhờ phép Quán để đạt đến viên mãn giác ngộ."}],"19":[{"en":[0],"vi":"Phải can đảm đối diện với già, bệnh, chết ngay khi còn khỏe mạnh, để buông bỏ những ham muốn tầm thường."},{"en":[1],"vi":"Ngày nào còn khỏe, còn sống, phải biết quý thời gian để làm điều thiện, tu hành,"},{"en":[2],"vi":"chớ uổng phí kiếp người vô nghĩa."}],"20":[{"en":[0],"vi":"Sự thật tiếp theo, Thân vốn bất tịnh."},{"en":[1],"vi":"Hành giả chỉ dùng thân để làm việc thiện và tu hành."}],"21":[{"en":[0],"vi":"Thân này cũng là Kết tinh của Nghiệp từ vô lượng kiếp."},{"en":[1],"vi":"Hành giả phải thấy thân cũng là Khối Tội từ vô lượng kiếp."}],"22":[{"en":[0],"vi":"Thân này mang một kiết sử bản năng mãnh liệt là ham sống sợ chết."},{"en":[1],"vi":"Thân này thật là gánh nặng."}],"23":[{"en":[0],"vi":"Khi tâm tỉnh giác yên tĩnh, phải quán chiếu sâu xa đến sự thật cuối cùng: Trạng thái này vẫn còn là Vô Minh và Tội Lỗi."},{"en":[1],"vi":"Chừng nào chưa đạt Tam Minh Lục Thông, chừng đó vẫn còn Vô minh và Tội lỗi."},{"en":[2],"vi":"Hành giả phải ghi xương khắc cốt sự thật cuối cùng này cho đến ngày hoàn toàn giải thoát."}],"24":[{"en":[0,1],"vi":"Sự tiến bộ tới đâu thì sự quán chiếu cũng phải đi theo tới đó để kiềm giữ không cho kiêu mạn trỗi dậy, để giữ gìn đức hạnh hiền lành, để hướng về Vô ngã trọn vẹn."}],"25":[{"en":[0,1,2],"vi":"Này đại chúng, ngoài lúc tọa thiền, mỗi khoảnh khắc thời gian đều quán Thân này Vô Thường Tội Lỗi, Chính mình chỉ là Vô Minh Tội Lỗi."},{"en":[3],"vi":"Dù thức hay ngủ, làm việc hay nghỉ ngơi, không phút giây nào buông lơi quán chiếu."}],"26":[{"en":[0,1],"vi":"Người không có duyên mặc định sẽ đắc đạo, đường tu vất vả gian lao, phải siêng dụng công kỹ lưỡng đầy đủ, chính xác từng chi tiết nhỏ, mới không bị tai hại, bệnh tật."}],"27":[{"en":[0],"vi":"Này đại chúng, Công Đức Lành là yếu tố quan trọng trong việc tu thiền."},{"en":[1],"vi":"Dù có nỗ lực hay có phương pháp đúng, nhưng thiếu công đức lành, thiền định vẫn không thể thành tựu."}],"28":[{"en":[0],"vi":"Có hai công đức mà hành giả phải vun đắp mãi mãi là: Tôn kính bậc A La Hán Chánh Đẳng Giác, và Độ cho chúng sinh tu hành chứng ngộ."}],"29":[{"en":[0],"vi":"Khi tâm trở nên yên tĩnh, hành giả dễ khởi ý nghĩ từ bỏ tất cả, nên trở thành vô trách nhiệm với chúng sinh."},{"en":[1],"vi":"Dù tâm có yên tĩnh, nhưng hạnh nguyện độ sinh không bao giờ chấm dứt, trách nhiệm với chúng sinh không bao giờ vơi cạn."}],"30":[{"en":[0,1],"vi":"Này đại chúng, phải có công đức lành rất nhiều, một người mới có thể thường xuyên nhớ mình là Vô Minh Tội Lỗi."},{"en":[2],"vi":"Hành giả phải thường lễ kính các bậc A La Hán Chánh Đẳng Giác để xin sám hối các nghiệp bất thiện từ quá khứ."}],"31":[{"en":[0,1],"vi":"Khi luôn nhớ mình chỉ là Vô minh Tội lỗi, hành giả sẽ cảm nhận rằng suốt đời chỉ mong được nhớ chính mình là Vô minh Tội lỗi, chứ không còn mong chứng ngộ cao siêu."}],"32":[{"en":[0,1],"vi":"Cúi lạy Phật từ bi gia hộ cho chúng con mãi mãi khắc ghi lời Kinh Chánh Tinh Tấn nhiệm màu, chân lý cao quý mà Chư Phật Mười Phương Ba Đời đều tuyên thuyết."},{"en":[2],"vi":"Cúi lạy Ngài Xá Lợi Phất, bậc Đệ Nhất Trí Tuệ đã từ bi giảng giải nghĩa lý thâm sâu, dẫn dắt chúng con vững bước trên con đường giải thoát."},{"en":[3],"vi":"Nguyện tất cả chúng sinh thành tựu ý chí kiên định phi thường, từng bước gây tạo vô lượng công đức, tinh tấn thực hành thiền định đúng phương pháp, mãi theo Phật đến bờ giác vô biên."}],"33":[{"en":[0],"vi":"NAM MÔ ĐỆ NHẤT TRÍ TUỆ THỐNG LĨNH TĂNG ĐOÀN XÁ LỢI PHẤT TÔN GIẢ"}],"34":[{"en":[0],"vi":"NAM MÔ BỔN SƯ THÍCH CA MÂU NI PHẬT (3 lần)"}]},"gram":{"0.2":"Cấu trúc: “the following is what + S + V” = “điều sau đây là những gì … đã …”. “taught in detail about” = giảng giải tường tận về.","1.0":"Câu dài gồm 3 phần: (1) mệnh đề thời gian “when Right Livelihood is well established and provides…” – khi Chánh Mạng đã ổn định; (2) mệnh đề chính “practitioners should begin to carry on the Right Meditative Endeavour”; (3) cụm phân từ “diligently cultivating meditation to attain…” – bổ nghĩa, cho biết cách làm và mục đích (to attain = để đạt).","2.0":"“where results have yet to appear” là mệnh đề quan hệ bổ nghĩa cho “stage”. “have yet to + V” = vẫn chưa (kết quả vẫn chưa xuất hiện).","2.1":"“Still” ở đầu câu nghĩa là “tuy vậy”. “just as travelers need … to set out with care and confidence” – phép so sánh: “just as” = giống như. “set out” = lên đường.","2.2":"Dấu gạch dài “—” giải thích thêm cho vế trước. “Progress requires …” = Sự tiến bộ đòi hỏi …","3.2":"“refers to” = chỉ, ám chỉ. “while” ở đây là “trong khi đó”, dùng để đối chiếu Chỉ và Quán.","4.0":"“as all Buddhas have done” – “as” = như; thì hiện tại hoàn thành “have done” chỉ việc chư Phật đã làm. “to attain enlightenment” = để chứng đạo.","4.1":"Sau dấu “:” là một chuỗi cụm danh từ liệt kê từng chi tiết tư thế, lược bỏ động từ “is/are”: “the spine (is) upright”, “the body (is) relaxed yet still”… “yet” = mà vẫn.","5.1":"“By + V-ing” = bằng cách / nhờ. Hai việc: maintaining … and keeping … Kết quả: “practitioners become more clearly aware…”. “allowing the mind to grow more mindful” = giúp tâm tỉnh giác hơn.","6.0":"“when practitioners master …” – mệnh đề thời gian. “they should contemplate the obvious truth:” – sau dấu hai chấm là nội dung sự thật.","7.2":"“By observing the breath in this way” = nhờ theo dõi hơi thở như thế. Hai kết quả nối bằng “and”: tâm an hơn, vọng tưởng lắng xuống (subside).","8.1":"“Whoever + V” = bất cứ ai. “gains mastery over” = làm chủ được.","8.4":"“Let + O + V” = hãy để. “without forcing or controlling the breath to be …” = không ép hay điều khiển hơi thở thành … “than it naturally is” = so với tự nhiên vốn có.","9.0":"“they will discover that …” – mệnh đề “that” làm tân ngữ. “lies not in the head but in the lower abdomen” – cấu trúc “not A but B” = không phải A mà là B.","9.1":"“Focusing attention on the head” là chủ ngữ dạng V-ing. “on the contrary” = trái lại. “makes the mind tense and tired” – make + O + tính từ = làm cho … trở nên …","11.0":"“that trap beings in …” – mệnh đề quan hệ bổ nghĩa cho “states of mind”: những trạng thái tâm giam giữ chúng sinh trong …","11.1":"Chủ ngữ dài: “Simply being aware that the mind is burning with …” (chỉ cần biết rằng tâm đang bị thiêu đốt bởi …). Động từ chính: “will … cause them to fade away”. “over time” = lâu dần.","12.0":"“As awareness strengthens” – “as” = khi/trong lúc. “guide the breath to become …” = dẫn hơi thở trở nên … “no longer …” = không còn …","13.0":"“there comes a moment when …” = rồi sẽ đến lúc … “where the breath seems to ‘stick’ to the mind” – mệnh đề quan hệ chỉ mức hơi thở đó.","13.1":"“giving practitioners a firm anchor” – cụm phân từ chỉ kết quả. “just like someone holding onto a solid pillar …, remaining steady and unswept” – so sánh với người bám cột, vẫn vững không bị cuốn.","14.0":"“that the ancient scriptures call Kanda” – mệnh đề quan hệ: điểm mà kinh xưa gọi là Kanda. “located about six centimetres below the navel” = nằm khoảng sáu phân dưới rốn.","14.1":"“can be discerned only through wisdom” – câu bị động: chỉ có thể được nhận ra bằng trí tuệ.","14.3":"“It is like gathering … or tethering a boat, once swept away by wind and waves, firmly to a post” – “once swept away …” là cụm bổ nghĩa chen giữa: chiếc thuyền từng bị sóng gió cuốn đi.","15.0":"“The highest technique … is when …” = kỹ thuật cao nhất là khi … “the precise volume of breath where …” = đúng cường độ hơi thở mà ở đó …","15.2":"“as doing so may lead to …” – “as” = vì; “doing so” = làm như vậy.","17.0":"Chủ ngữ dạng V-ing: “Dwelling in awareness of the entire body” (an trú cái biết toàn thân). “must be paired with” – bị động: phải được kết hợp với.","18.1":"Đảo ngữ sau “Only through …”: “Only through Insight meditation can practitioners attain …” (động từ khuyết thiếu “can” đứng trước chủ ngữ) = Chỉ nhờ thiền Quán, hành giả mới có thể đạt …","19.0":"“be brave to face” = can đảm đối diện. “even while we are still young and well” = ngay cả khi còn trẻ khỏe. “so that we can let go of …” = để chúng ta có thể buông bỏ …","19.1":"“As long as …” = chừng nào còn … “doing good deeds and practicing the Dharma diligently” – cụm V-ing chỉ cách quý thời gian.","20.1":"“should be regarded simply as a tool for …” – bị động: nên được xem đơn giản là công cụ để … “not as an object for …” = chứ không phải …","21.1":"“see this body as a mass of sins accumulated from …” – “see A as B” = xem A là B; “accumulated from” = được tích tụ từ.","23.0":"“Even when …” = ngay cả khi. Sau “:” là nội dung sự thật: “this peaceful state is still bound by …” – bị động: vẫn bị trói buộc bởi …","23.1":"“Unless …” = trừ khi / chừng nào chưa … “with the Three Knowledges and the Six Supernatural Powers” = với Tam Minh Lục Thông.","24.0":"Cấu trúc so sánh kép: “The more …, the deeper …” = càng … thì càng …","24.1":"Chủ ngữ “Such reflections” + ba động từ song song: prevent …, protect …, guide … “prevent pride from arising” = ngăn kiêu mạn khởi lên.","25.3":"“Whether A or B, C or D” = dù A hay B, C hay D. “do not let even a single moment pass without …” = đừng để dù một khoảnh khắc trôi qua mà không …","26.1":"“requires their practice to be diligent, thorough and precise” – require + O + to be = đòi hỏi … phải …","27.1":"“Even with … , without sufficient merit, one still cannot …” = Dù có …, nếu thiếu đủ công đức, người ta vẫn không thể … “one” = người ta.","28.0":"Sau dấu “:” liệt kê hai công đức: “first, reverence toward …”, “and second, the effort to guide …”.","29.0":"“which can lead to …” – “which” thay cho cả ý trước (ý muốn buông bỏ tất cả). “toward other beings” = đối với chúng sinh.","29.1":"“No matter how still or peaceful the mind becomes” = Dù tâm có yên tĩnh đến đâu. Hai vế “must remain unshaken” và “must never fade”.","30.2":"“Therefore” = vì vậy. “bow in reverence to …” = cúi lạy tôn kính. “repent for …” = sám hối về …","31.1":"“no longer desire … but merely wish to …” = không còn mong … mà chỉ mong …","32.1":"“May the Buddha bless us to …” – “May + S + V” dùng để cầu nguyện: Nguyện/cầu xin … “proclaimed by all Buddhas” = được chư Phật tuyên thuyết.","32.2":"“who compassionately explained …” – mệnh đề quan hệ chỉ Ngài Xá Lợi Phất. “guiding us steadily on …” = dẫn dắt chúng con vững bước trên …","32.3":"“May all sentient beings develop …, steadily accumulate …, diligently practice …, and forever follow …” – bốn động từ song song sau “May”."},"meo":["Right = đúng (chánh); Meditative = thuộc về thiền; Endeavour = nỗ lực. Ghép lại: nỗ lực thiền đúng đắn.","Four = bốn; Noble = cao quý (Diệu); Truths = chân lý (Đế).","Livelihood = sinh kế, cách kiếm sống. Gốc “live” (sống) + “-lihood”.","Cessation từ “cease” = dừng lại. Chỉ = dừng vọng tưởng.","In + sight = nhìn vào bên trong. Quán = nhìn sâu.","Họ từ: contemplate (động từ) → contemplation (danh từ). Nhấn âm đầu: CON-tem-plate.","im- (không) + permanent (thường còn) = vô thường. Danh từ: impermanence.","en- (làm cho) + light (ánh sáng) + -ment = sự được soi sáng → giác ngộ.","awake = thức → awakening = sự thức tỉnh. Spiritual = thuộc tâm linh.","cultivate = trồng trọt, vun bồi → cultivation. Tu tập như vun trồng một cái cây.","false = sai; attach = dính vào → attachments = những chỗ bám víu.","un- (không) + wholesome (lành) = bất thiện.","ignore = phớt lờ, không biết → ignorance = sự không biết, vô minh.","ego = cái tôi; cling = bám chặt. Chấp ngã = bám chặt vào cái tôi.","Non- (không) + self (tự ngã) = vô ngã.","Karma (gốc Phạn) = nghiệp. Tính từ: karmic.","count = đếm; -less = không → countless = không đếm được. lifetime = một đời.","Fetter = xiềng chân. Kiết sử như sợi xích trói chân.","Three = 3 (Tam Minh), Six = 6 (Lục Thông). Knowledge = minh; supernatural power = thần thông.","liberate = giải phóng → liberation = sự giải thoát.","Merit = công đức, điều xứng đáng được hưởng.","Perfectly = hoàn hảo; Enlightened = đã giác ngộ; Ones = những bậc.","sentient = có cảm giác, có tri giác; beings = những loài. → chúng sinh.","re- (lại) + pent (hối tiếc) = sám hối.","Dharma (gốc Phạn) = Pháp. practice the Dharma = tu hành.","Jhana (gốc Pali) = thiền na, tầng thiền. First = thứ nhất.","absorb = thấm, hút vào → absorption = sự nhập sâu.","un- (không) + clean (sạch) = bất tịnh. by nature = vốn dĩ.","sin = tội lỗi; sinful = đầy tội lỗi. Âm /ɪ/ ngắn, không đọc “xin” kéo dài.","vow = lời nguyện; help all beings = giúp mọi chúng sinh.","Name (Danh) = phần tâm; Form (Sắc) = phần thân.","Deer = con nai; Park = vườn → vườn Nai, Lộc Uyển.","Venerable = đáng kính (Tôn giả). Sariputta nhấn âm “PU”.","Kanda: đọc “CAN-đơ”, nhấn âm đầu.","Shakya = dòng họ Thích Ca; Muni = bậc hiền; Buddha = Phật.","Namo = quy kính, nam mô.","meditate (thiền) → meditation (danh từ). Nhấn: me-di-TA-tion.","practice (tu tập) → practitioner (người tu tập). Thêm -s: practitioners.","full = trọn; lotus = hoa sen; posture = tư thế.","pose = tư thế → posture. Đọc “PÁT-chơ”.","spine = cột sống; upright = thẳng đứng.","relaxed = thả lỏng; yet = mà vẫn; still = bất động.","cross = bắt chéo → crossed. firmly = chắc chắn.","palm = lòng bàn tay (chữ “l” câm); upward = hướng lên.","upper = phía trên; palate = vòm miệng.","stable = vững → stabilize → stabilization = sự làm cho vững: Điều Thân.","breath (danh từ, /brɛθ/) khác breathe (động từ, /brið/).","breathe in = hít vào. -ing: breathing in.","breathe out = thở ra.","wander = đi lang thang → wandering thoughts = ý nghĩ lang thang: vọng tưởng.","lower = phía dưới; abdomen = bụng.","anchor = mỏ neo; to anchor = neo lại. Chữ “ch” đọc /k/.","Tranquil = yên lặng, thanh tịnh. Gần nghĩa: calm, peaceful.","Alert = tỉnh táo, sẵn sàng.","mind (tâm) + -ful (đầy) = mindful: tâm luôn có mặt, tỉnh giác.","aware (biết rõ) → awareness (sự biết rõ).","sit (ngồi) → sitting meditation = tọa thiền.","deep = sâu; still (yên) → stillness = sự yên lặng.","inner = bên trong; storm = cơn bão.","volume = lượng, cường độ; of breath = của hơi thở.","Greed = tham. Tính từ: greedy.","Anger = sân. Tính từ: angry.","jealous → jealousy = đố kỵ.","arrogant → arrogance = kiêu mạn.","proud → pride = kiêu hãnh, tự cao.","ir- (không) + responsibility (trách nhiệm) = vô trách nhiệm.","self (mình) + -ish + -ness = tính chỉ nghĩ cho mình: ích kỷ.","self = tự mình; praise = khen → tự khen.","humble = khiêm tốn → humility = đức khiêm hạ.","Reverence = lòng tôn kính. Động từ: revere.","diligent = siêng năng → diligently (trạng từ), diligence (danh từ).","patient = kiên nhẫn (tính từ) → patience (danh từ).","un- (không) + shake (lay) + -able (có thể) = không thể lay chuyển.","com- (cùng) + passion (cảm xúc) = cùng cảm thông: từ bi.","sense = cảm nhận; responsibility = trách nhiệm.","joy (niềm vui) → joyful; feelings = cảm giác → hỷ lạc.","in- (không) + different → indifference = sự thờ ơ, không quan tâm.","suffer = chịu khổ → suffering = khổ đau.","grade = bậc → gradual → gradually = từng bậc, dần dần.","persist = bền bỉ → persistently.","precious = quý giá; human life = kiếp người.","treasure = kho báu → (động từ) quý trọng như báu vật.","Burden = gánh nặng. Đọc “BƠR-đần”.","clear = rõ ràng; detailed = chi tiết; map = bản đồ.","face (mặt) → to face = đối mặt; truths = các sự thật.","let go (of) = buông ra, buông bỏ.","tense = căng → tension = sự căng thẳng.","essential = thiết yếu; foundation = nền móng.","skill = kỹ năng → skillful → skillfully = khéo léo.","dear = thân mến; fellows = các bạn đồng tu → Này đại chúng.","Câu mở đầu quen thuộc của các bộ kinh, tương ứng “Evaṃ me sutaṃ”.","Ba tính từ cho hơi thở: slow (chậm), little (ít), gentle (êm).","stick = dính. Đặt trong ngoặc kép vì là cách nói hình ảnh.","crave = thèm khát → craving; fear = sợ; death = cái chết.","but = chỉ là (nghĩa cổ). This self = chính mình.","engrave = khắc. Khắc vào tim = ghi xương khắc cốt.","bow = cúi lạy (đọc /baʊ/ như “bao”); reverence = tôn kính.","Breathe in (động từ) … breathing in (đang thở vào).","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],"pat":[{"p":"The more …, the deeper …","vi":"Càng … thì càng sâu …","src":[24,0],"ex":[["The more we practice, the deeper our awareness becomes.","Càng tu tập, sự tỉnh giác của chúng ta càng sâu."],["The more we listen, the deeper we understand.","Càng lắng nghe, ta càng hiểu sâu."],["The more gentle the breath, the deeper the stillness.","Hơi thở càng êm, sự yên lắng càng sâu."]]},{"p":"Whether … or …, …","vi":"Dù … hay …, …","src":[25,3],"ex":[["Whether awake or asleep, I remember the breath.","Dù thức hay ngủ, tôi nhớ hơi thở."],["Whether working or resting, keep the mind calm.","Dù làm việc hay nghỉ ngơi, hãy giữ tâm an."],["Whether young or old, we must treasure our time.","Dù trẻ hay già, ta phải quý thời gian."]]},{"p":"not A but B","vi":"không phải A mà là B","src":[9,0],"ex":[["The source lies not in the head but in the lower abdomen.","Nguồn gốc không nằm ở đầu mà ở bụng dưới."],["Peace comes not from outside but from within.","Bình an không đến từ bên ngoài mà từ bên trong."],["We practice not for praise but for liberation.","Ta tu không vì lời khen mà vì giải thoát."]]},{"p":"By + V-ing, …","vi":"Bằng cách / nhờ …","src":[7,2],"ex":[["By observing the breath, the mind becomes calm.","Nhờ theo dõi hơi thở, tâm trở nên an."],["By sitting correctly, we become aware of the whole body.","Nhờ ngồi đúng, ta biết rõ toàn thân."],["By repenting sincerely, we grow in humility.","Nhờ sám hối chân thành, ta thêm khiêm hạ."]]},{"p":"Only through … can …","vi":"Chỉ nhờ … mới có thể …","src":[18,1],"ex":[["Only through patience can we make progress.","Chỉ nhờ kiên nhẫn ta mới tiến bộ."],["Only through Insight can ignorance be uprooted.","Chỉ nhờ Quán mới nhổ được gốc vô minh."],["Only through practice can we understand the Dharma.","Chỉ nhờ tu tập ta mới hiểu được Pháp."]]},{"p":"let go of …","vi":"buông bỏ …","src":[19,0],"ex":[["Let go of worldly desires.","Hãy buông bỏ ham muốn thế gian."],["It is hard to let go of pride.","Thật khó buông bỏ kiêu mạn."],["Breathe out and let go of tension.","Thở ra và buông bỏ căng thẳng."]]},{"p":"be bound by …","vi":"bị trói buộc bởi …","src":[23,0],"ex":[["This peaceful state is still bound by ignorance.","Trạng thái an bình này vẫn bị vô minh trói buộc."],["Beings are bound by craving.","Chúng sinh bị ái dục trói buộc."],["We are no longer bound by fear.","Chúng ta không còn bị nỗi sợ trói buộc."]]},{"p":"As long as …, we must …","vi":"Chừng nào còn …, ta phải …","src":[19,1],"ex":[["As long as we are healthy, we must practice diligently.","Chừng nào còn khỏe, ta phải siêng tu."],["As long as we breathe, we can begin again.","Chừng nào còn thở, ta còn có thể bắt đầu lại."],["As long as ignorance remains, we must keep contemplating.","Chừng nào vô minh còn, ta phải tiếp tục quán chiếu."]]},{"p":"No matter how …, …","vi":"Dù … đến đâu, …","src":[29,1],"ex":[["No matter how still the mind becomes, keep the vow to help all beings.","Dù tâm yên tĩnh đến đâu, hãy giữ hạnh nguyện độ sinh."],["No matter how hard it is, do not give up.","Dù khó đến đâu, đừng bỏ cuộc."],["No matter how busy we are, we can breathe mindfully.","Dù bận đến đâu, ta vẫn có thể thở trong tỉnh giác."]]},{"p":"prevent … from + V-ing","vi":"ngăn … khỏi …","src":[24,1],"ex":[["Contemplation prevents pride from arising.","Quán chiếu ngăn kiêu mạn khởi lên."],["Awareness prevents anger from growing.","Tỉnh giác ngăn sân hận lớn thêm."],["A firm anchor prevents the boat from drifting away.","Neo chắc ngăn thuyền trôi đi."]]},{"p":"see A as B","vi":"xem A là B","src":[21,1],"ex":[["See this body as impermanent.","Hãy xem thân này là vô thường."],["See each day as a precious gift.","Hãy xem mỗi ngày là món quà quý."],["See difficulties as chances to practice.","Hãy xem khó khăn là cơ hội tu tập."]]},{"p":"May + S + V …","vi":"Nguyện cho / Cầu mong …","src":[32,3],"ex":[["May all beings be free from suffering.","Nguyện cho mọi chúng sinh thoát khổ."],["May we always remember this truth.","Nguyện chúng con luôn nhớ sự thật này."],["May the Buddha bless us with wisdom.","Nguyện Phật gia hộ cho chúng con trí tuệ."]]}],"main":[[["Ai giảng giải về Chánh Tinh Tấn?",["Tôn giả Xá Lợi Phất","Tôn giả A Nan","Đức Phật ở Lộc Uyển","Một thiền sư"],0],["Chánh Tinh Tấn được ví như điều gì người lữ hành cần?",["Bản đồ chi tiết","Chiếc thuyền","Ngọn đèn","Cây gậy"],0]],[["Hai con đường vào thiền định là gì?",["Chỉ và Quán","Giới và Định","Tham và Sân","Thân và Tâm"],0],["Đoạn này hướng dẫn chủ yếu về điều gì?",["Tư thế ngồi kiết già","Cách ăn uống","Cách tụng kinh","Cách đi kinh hành"],0]],[["Khi điều thân thuần thục, hành giả quán sự thật nào?",["Thân vô thường","Thân trường tồn","Tâm thanh tịnh","Thế gian an vui"],0],["Hơi thở kết nối những gì?",["Thân và Tâm, Danh và Sắc","Trời và đất","Thầy và trò","Ngày và đêm"],0]],[["Nguồn của vọng tưởng nằm ở đâu?",["Ở dưới thân (bụng dưới)","Ở trên đầu","Ở trái tim","Ở hai bàn tay"],0],["Chỉ cần làm gì thì các tâm bất thiện sẽ mất dần?",["BIẾT tâm đang bị thiêu đốt","Cố đè nén chúng","Tránh né chúng","Quên chúng đi"],0]],[["Hơi thở cần giữ như thế nào?",["Chậm – Ít – Êm","Nhanh – Mạnh – Sâu","Dài – Mạnh – Đều","Ngắn – Nhanh – Gấp"],0],["Khi hơi thở dính với tâm, hành giả được ví như ai?",["Người bám trụ cột giữa bão","Người chèo thuyền","Người leo núi","Người lữ hành"],0]],[["Điểm Kanda nằm ở đâu?",["Khoảng sáu phân dưới rốn, trên mặt da","Giữa hai chân mày","Đỉnh đầu","Giữa ngực"],0],["Kỹ thuật đỉnh cao của thiền là gì?",["Tìm hơi thở dính với tâm","Ngồi thật lâu","Trực tiếp điều khiển tâm","Thở thật mạnh"],0]],[["Khi hỷ lạc xuất hiện, hành giả dễ rơi vào điều gì?",["Tự khen và kiêu mạn","Buồn ngủ","Sợ hãi","Nóng giận"],0],["Vì sao phép Chỉ cần đi cùng phép Quán?",["Chỉ không nhổ hết vô minh chấp ngã","Chỉ quá khó","Quán dễ hơn Chỉ","Để ngồi lâu hơn"],0]],[["Thân này mang kiết sử bản năng nào?",["Ham sống sợ chết","Ham ăn ngủ","Thích khen chê","Ham danh lợi"],0],["Ngoài giờ tọa thiền, hành giả cần làm gì?",["Luôn quán thân vô thường tội lỗi","Nghỉ ngơi hoàn toàn","Đọc sách giải trí","Không cần làm gì"],0]],[["Hai công đức cần vun đắp là gì?",["Tôn kính bậc Chánh Đẳng Giác và độ chúng sinh","Bố thí và trì giới","Tụng kinh và niệm Phật","Ăn chay và phóng sinh"],0],["Khi tâm yên tĩnh, điều gì không được vơi cạn?",["Trách nhiệm với chúng sinh","Sức khỏe","Thời gian ngồi thiền","Lời khen"],0]],[["Đoạn hồi hướng cúi lạy những ai?",["Đức Phật và Ngài Xá Lợi Phất","Các vị vua","Cha mẹ","Thầy giáo"],0],["Lời nguyện cho chúng sinh gồm điều gì?",["Ý chí kiên định, công đức, thiền đúng pháp","Giàu sang, danh vọng","Sống lâu, khỏe mạnh","Thông minh, học giỏi"],0]]],"comp":[[["Where did the Buddha preach the Four Noble Truths?",["At the Deer Park","On a mountain","In a palace","By a river"],0,[0,1]],["What do travelers need before a long journey?",["A clear and detailed map","A strong horse","A lot of money","A good friend"],0,[2,1]],["What does progress require?",["Unwavering patience and diligence","Quick results","Strong breath","Many books"],0,[2,2]]],[["What are the two complementary paths to meditation?",["Cessation and Insight","Body and Mind","Name and Form","Greed and Anger"],0,[3,1]],["How should the palms be placed?",["Facing upward, one atop the other","Facing downward on the knees","Joined in front of the chest","Raised above the head"],0,[4,1]],["What does correct posture help the mind to become?",["More mindful","More tense","More restless","More proud"],0,[5,1]]],[["What is the obvious truth about the body?",["The body is impermanent","The body is perfect","The body never changes","The body is the self"],0,[6,1]],["What happens to wandering thoughts when we observe the breath?",["They begin to subside","They grow stronger","They move to the head","They never change"],0,[7,2]],["Should we force the breath to be longer or stronger?",["No, the knowing should be gentle","Yes, always","Only in the morning","Only when tired"],0,[8,4]]],[["Where does the source of wandering thoughts lie?",["In the lower abdomen","In the head","In the heart","In the hands"],0,[9,0]],["What is this world like, according to the sutra?",["Impermanent, like a dream","Permanent and perfect","Always joyful","Easy to understand"],0,[10,2]],["What makes unwholesome states fade away over time?",["Simply being aware of them","Fighting them hard","Ignoring them","Talking about them"],0,[11,1]]],[["How should the breath become?",["Slow, little, and gentle","Fast, heavy, and rapid","Long and strong","Short and quick"],0,[12,0]],["What seems to “stick” to the mind?",["The breath","The posture","The sound","The thought"],0,[13,0]],["What is the practitioner compared to in the storm?",["Someone holding onto a solid pillar","A bird flying away","A falling leaf","A sleeping child"],0,[13,1]]],[["Where is the Kanda point?",["About six centimetres below the navel","Between the eyebrows","On top of the head","In the chest"],0,[14,0]],["How old was the Buddha when He entered the First Jhana?",["Twelve years old","Six years old","Twenty years old","Thirty-five years old"],0,[14,7]],["Why should we not control the mind directly?",["It may lead to tension or illness","It is too easy","It takes too long","It is not allowed"],0,[15,2]]],[["What function door(x,y,s,open){return g(tr(x,y,s),r(-30,-80,60,80,P.earth2,4)+r(-24,-74,48,74,open?P.gold:P.brown,2)+(open?p('M-24,-74 L-4,-66 L-4,-4 L-24,0Z',P.brown):c(14,-36,3,P.gold)));}

function sprout(x,y,s){return seedling(x,y,s,1);}
function speech(x,y,s,txt){return g(tr(x,y,s),r(-34,-22,68,36,P.white,10)+p('M-10,14 L-18,26 L2,14Z',P.white)+(txt?'<text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="'+P.navy+'">'+txt+'</text>':l('M-20,-8 H20 M-20,2 H10',P.grey,3)));}

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const SPANS=SENT.map(s=>{
  const offs=[]; const re=/\S+/g; let m; while((m=re.exec(s.text))) offs.push([m.index,m.index+m[0].length]);
  const c=[];
  VOC.forEach(v=>v.f.forEach(f=>{const rx=new RegExp('(?<![A-Za-z])'+escRe(f)+'(?![A-Za-z])','gi'); let mm;
    while((mm=rx.exec(s.text))){const a0=mm.index,e0=a0+mm[0].length; const a=offs.findIndex(o=>o[1]>a0), b=offs.findIndex(o=>o[1]>=e0); if(a>=0&&b>=a) c.push({v:v.id,a,b,len:e0-a0});}}));
  c.sort((x,y)=>y.len-x.len); const used=[]; const out=[];
  c.forEach(x=>{for(let k=x.a;k<=x.b;k++) if(used[k]) return; for(let k=x.a;k<=x.b;k++) used[k]=1; out.push(x);});
  return out.sort((x,y)=>x.a-y.a);
});
const OCC={}; SPANS.forEach((sp,si)=>sp.forEach(p=>{(OCC[p.v]=OCC[p.v]||[]).push({si,a:p.a,b:p.b});}));
function makeUnits(s){
  const T=s.tok; let pieces=[]; if(T.length<=15) return [[0,T.length-1]];
  let st=0; T.forEach((t,k)=>{ if(/[,;:—–]["”]?$/.test(t)||t==='—'||k===T.length-1){pieces.push([st,k]); st=k+1;} });
  const p2=[]; pieces.forEach(([a,b])=>{while(b-a+1>15){p2.push([a,a+10]); a+=11;} p2.push([a,b]);});
  const units=[]; let cur=null;
  p2.forEach(p=>{ if(!cur){cur=p.slice();return;} if((cur[1]-cur[0]+1)<5||(p[1]-cur[0]+1)<=13) cur[1]=p[1]; else {units.push(cur); cur=p.slice();} });
  if(cur){ if(units.length&&cur[1]-cur[0]+1<4) units[units.length-1][1]=cur[1]; else units.push(cur); }
  return units;
}
const UNITS=[]; SENT.forEach(s=>makeUnits(s).forEach(([a,b])=>{UNITS.push({s:s.i,a,b,start:Math.max(0,s.w[a]-0.25),end:b+1<s.tok.length?s.w[b+1]-0.08:s.end});}));

function unitOf(si,k){return UNITS.find(u=>u.s===si&&u.a<=k&&u.b>=k);}

function phWord(t){ const parts=t.split(/[-—–]+/).map(p=>p.toLowerCase().replace(/[^a-z']/g,'').replace(/^'+|'+$/g,'')).filter(Boolean); if(!parts.length) return null;
  const r=parts.map(p=>PH[p]||PH[p.replace(/'s$/,'')]||null); if(r.some(x=>!x)) return null; return {ipa:r.map(x=>x[0]).join('-'),vn:r.map(x=>x[1]).join(' ')}; }
function phText(text){ const ws=text.split(/\s+/).map(phWord).filter(Boolean); return {ipa:'/'+ws.map(w=>w.ipa).join(' ')+'/',vn:ws.map(w=>w.vn).join(' · ')}; }
function phHTML(text,big){ const p=phText(text); const m=S.set.ph; let h='<div class="phon"'+(big?' style="font-size:1.1em"':'')+'>';
  if(m==='ipa'||m==='both') h+='<span class="ipa">'+esc(p.ipa)+'</span>'; if(m==='vn'||m==='both') h+='<span class="vn">'+esc(p.vn)+'</span>'; if(m==='off') h+='<span class="ipa">'+esc(p.ipa)+'</span>'; return h+'</div>'; }
function phRuby(t){ const m=S.set.ph; if(m==='off') return ''; const p=phWord(t); if(!p) return ''; const x=m==='vn'?p.vn:m==='both'?p.ipa:p.ipa; return '<span class="ph">'+esc(x)+'</span>'; }

function dayNum(d){d=d||new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);}
function dayKey(n){return new Date(n*864e5).toISOString().slice(0,10);}
const TODAY=()=>dayKey(dayNum());
const weekOf=n=>Math.floor((n+3)/7);
function minsToday(){return Math.floor(S.mins[TODAY()]||0)}
let lastAct=Date.now(), tickN=0;
['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{ if(document.hidden) return; const busy=(Date.now()-lastAct<60000)||!aud.paused; if(!busy) return;
  const k=TODAY(); const before=S.mins[k]||0; S.mins[k]=before+0.25; tickN++;
  if(before<S.set.goalMin&&S.mins[k]>=S.set.goalMin){toast('Đã đủ '+S.set.goalMin+' phút hôm nay. Tuyệt vời!'); updStreak(); checkBadges();}
  if(tickN%4===0) save(); if(UI.tab==='home'&&!OV&&tickN%4===0){const r=$('ringN'); if(r) r.textContent=minsToday();}
},15000);
function met(n){return (S.mins[dayKey(n)]||0)>=S.set.goalMin}
function streak(){ let n=dayNum(), c=0; if(!met(n)) n--; let changed=false;
  for(let guard=0;guard<400;guard++){ if(met(n)){c++; n--; continue;}
    const w=weekOf(n); const used=S.frz[w]; if((used==null||used===n)&&c>0&&n<dayNum()){ if(used==null){S.frz[w]=n; changed=true;} n--; continue; } break; }
  if(changed) save(); return c; }
function updStreak(){const el=$('streak'); if(el) el.innerHTML=IC.flame+'<span>'+streak()+'</span>';}
function logSpeak(sc,text){ S.sp.push([dayNum(),sc]); if(S.sp.length>600) S.sp.splice(0,S.sp.length-600); if(sc>=85) S.stat.sp85++; if(/This self is/i.test(text||'')) S.stat.khiem++; save(); checkBadges(); }

/* ================= FSRS (ôn lặp lại ngắt quãng) ================= */
const FW=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const FACTOR=19/81, DECAY=-0.5;
const clampD=d=>Math.min(10,Math.max(1,d));
const D0=g=>FW[4]-(g-3)*FW[5];
function fsrs(card,g){ const t=dayNum(); const c=Object.assign({s:0,d:0,last:t,due:t,reps:0,lapses:0,dir:0},card||{});
  if(!c.s){ c.s=FW[g-1]; c.d=clampD(D0(g)); c.first=c.first||t; }
  else { const el=Math.max(0,t-c.last); const R=Math.pow(1+FACTOR*el/c.s,DECAY);
    if(g===1){ c.s=Math.max(0.1,FW[11]*Math.pow(c.d,-FW[12])*(Math.pow(c.s+1,FW[13])-1)*Math.exp(FW[14]*(1-R))); c.lapses++; }
    else c.s=c.s*(1+Math.exp(FW[8])*(11-c.d)*Math.pow(c.s,-FW[9])*(Math.exp(FW[10]*(1-R))-1)*(g===2?FW[15]:1)*(g===4?FW[16]:1));
    c.d=clampD(FW[7]*D0(4)+(1-FW[7])*(c.d-FW[6]*(g-3))); }
  c.reps++; c.last=t; c.due=g===1?t:t+Math.min(365,Math.max(1,Math.round(c.s))); return c; }
function grade(id,g,dirBit){ const c=fsrs(S.srs[id],g); if(dirBit!=null&&g>=3) c.dir|=dirBit; S.srs[id]=c; S.stat.rev++; if(g===1) miss(id); save(); checkBadges(); }
const DIRS=['Nghe → nghĩa','Nhìn hình → nói từ','Nghĩa → gõ từ','Điền vào câu kinh','Nói câu kinh'];
function level(id){const c=S.srs[id]; if(!c) return 0; let n=0; for(let k=0;k<5;k++) if(c.dir&(1<<k)) n++; return Math.max(c.reps?1:0,n);}
function lotusHTML(id){const L=level(id); let h='<span class="lotus" title="Bậc thuộc '+L+'/5">'; for(let k=0;k<5;k++) h+='<i class="'+(k<L?'on':'')+'"></i>'; return h+'</span>';}

const aud=new Audio('kinh.mp3'); aud.preload='metadata';
fetch('kinh.mp3').then(r=>r.ok?r.blob():null).then(bl=>{ if(!bl) return; const u=URL.createObjectURL(bl);
  const swap=()=>{const t=aud.currentTime; aud.src=u; if(t) aud.addEventListener('loadedmetadata',()=>{aud.currentTime=t;},{once:true}); aud.load();};
  if(aud.paused) swap(); else aud.addEventListener('pause',swap,{once:true}); }).catch(()=>{});
let stopAt=null, tickFn=null, endFn=null, raf=0;
function stopTTS(){try{speechSynthesis.cancel();}catch(e){}}
function playSeg(a,b,onTick,onEnd,rate){ stopTTS(); stopUser(); stopAt=b; tickFn=onTick||null; endFn=onEnd||null;
  try{aud.playbackRate=rate||S.set.arate||1;}catch(e){}
  const go=()=>{aud.currentTime=a; aud.play().then(loop).catch(()=>toast('Chưa phát được âm thanh. Thầy bấm lại nút nghe nhé.'));};
  if(aud.readyState>=1) go(); else {aud.addEventListener('loadedmetadata',go,{once:true}); aud.load();} }
function loop(){cancelAnimationFrame(raf); const f=()=>{ if(aud.paused){return;} const t=aud.currentTime; if(tickFn) tickFn(t);
  if(stopAt!=null&&t>=stopAt){aud.pause(); const e=endFn; endFn=null; if(e) e(); return;} raf=requestAnimationFrame(f);}; raf=requestAnimationFrame(f);}
function stopAudio(){aud.pause(); stopAt=null; tickFn=null; endFn=null; cancelAnimationFrame(raf);}
let VOICE=null, VOICEVI=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices(); VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; VOICEVI=vs.find(v=>/^vi/i.test(v.lang))||null;}catch(e){}}
try{pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(text,rate,onEnd){ stopAudio(); stopUser(); try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).replace(/[“”"]/g,'')); u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=rate||S.set.rate; if(onEnd) u.onend=onEnd; speechSynthesis.speak(u);}catch(e){toast('Máy chưa hỗ trợ đọc tiếng Anh'); if(onEnd) onEnd();} }

const REC={can:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder),blocked:false,on:null,mr:null,stream:null,urls:{},models:{},user:new Audio(),timer:0};
function stopUser(){try{REC.user.pause();}catch(e){}}
async function recToggle(key,maxSec){
  if(REC.on===key){ try{REC.mr.stop();}catch(e){} return; }
  if(REC.on){ try{REC.mr.stop();}catch(e){} }
  if(!REC.can||REC.blocked){ toast('Thu âm chưa dùng được ở trang này. Ở bản cài lên điện thoại, Thầy thu âm được.'); return; }

  const chunks=[]; let mr; try{ mr=new MediaRecorder(REC.stream); }catch(e){ REC.blocked=true; REC.stream.getTracks().forEach(t=>t.stop()); refreshRec(); return; }
  REC.mr=mr; REC.on=key; mr.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data);};
  mr.onstop=()=>{ clearTimeout(REC.timer); REC.stream.getTracks().forEach(t=>t.stop()); const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); if(REC.urls[key]) URL.revokeObjectURL(REC.urls[key]); REC.urls[key]=URL.createObjectURL(b); REC.on=null; refreshRec(); playUser(key); };
  mr.start(); REC.timer=setTimeout(()=>{try{mr.stop();}catch(e){}},(maxSec||12)*1000); refreshRec(); }
function playUser(key,onEnd){ const u=REC.urls[key]; if(!u) return; stopAudio(); stopTTS(); REC.user.src=u; REC.user.onended=onEnd||null; REC.user.play().catch(()=>{}); }

   '<button class="btn sm '+(on?'bad':'')+'" data-a="rec" data-k="'+esc(key)+'" data-max="'+(maxSec||12)+'">'+(on?'<span class="recdot"></span> Dừng thu':IC.mic+' Thu âm')+'</button>'+
   (has?'<button class="btn sm" data-a="recplay" data-k="'+esc(key)+'">'+IC.play+' Giọng tôi</button><button class="btn sm" data-a="reccmp" data-k="'+esc(key)+'">'+IC.repeat+' So sánh</button>':'')+'</div>'; }

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micState=SR?'unknown':'none', curRec=null;
function listen(onInterim){ return new Promise((res,rej)=>{ let r; try{r=new SR();}catch(e){micState='none'; return rej('none');}
  r.lang='en-US'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1; let txt='', failed=false;
  r.onresult=e=>{let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript+' '; txt=t.trim(); if(onInterim) onInterim(txt);};
  r.onerror=e=>{failed=true; if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){micState='blocked'; rej('blocked');} else if(e.error==='no-speech'){rej('nospeech');} else if(e.error==='network'){rej('network');} else rej(e.error||'err');};
  r.onend=()=>{curRec=null; if(!failed){ if(txt) micState='ok'; res(txt);} };
  curRec=r; try{r.start();}catch(e){failed=true; micState='blocked'; rej('blocked');} }); }
function stopRec(){try{curRec&&curRec.stop();}catch(e){}}
const noMic=()=>micState==='blocked'||micState==='none';
const nw=w=>w.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9']/g,'').replace(/'s$/,'').replace(/our$/,'or');
function lev(a,b){const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array(n+1).fill(0).map((_,j)=>j); for(let i=1;i<=m;i++){const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c;} return p[n];}
function near(a,b,proper){ if(a===b) return true; const L=Math.max(a.length,b.length); if(L<3) return false; const d=lev(a,b); if(proper) return d/L<=0.5; if(L<=4) return false; if(L<=7) return d<=1; return d/L<=0.3; }
function scoreWords(tokens,heard){
  const parts=[]; tokens.forEach((t,k)=>t.split(/[-—–]+/).forEach(p=>{const n=nw(p); if(n) parts.push({k,n,proper:/^[A-Z]/.test(p)&&k>0});}));
  const H=heard.split(/[\s-]+/).map(nw).filter(Boolean);
  const m=parts.length,n=H.length; const dp=Array(m+1).fill(0).map(()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=near(parts[i].n,H[j],parts[i].proper)?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);
  const okp=Array(m).fill(false); let i=0,j=0; while(i<m&&j<n){ if(near(parts[i].n,H[j],parts[i].proper)){okp[i]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return tokens.map((t,k)=>{const ps=parts.map((p,x)=>[p,x]).filter(([p])=>p.k===k); return ps.length?ps.every(([,x])=>okp[x]):true;});
}

function holeSay(u,hideIds,res,okArr,peekSet){ /* câu có chỗ đục lỗ cho các từ trong hideIds */
  const s=SENT[u.s]; const holes=[]; SPANS[u.s].forEach(p=>{ if(p.a>=u.a&&p.b<=u.b&&hideIds(p.v)) holes.push(p); });
  const inH={}; holes.forEach((h,x)=>{for(let k=h.a;k<=h.b;k++) inH[k]=x;}); const out=[]; let k=u.a;
  while(k<=u.b){ if(inH[k]!=null){ const x=inH[k], hl=holes[x]; const toks=s.tok.slice(hl.a,hl.b+1); const f=tokParts(toks[0]), l=tokParts(toks[toks.length-1]);
      const words=toks.map((t,j)=>{let [a,c,b]=tokParts(t); if(j===0) a=''; if(j===toks.length-1) b=''; return a+c+b;}).join(' ');
      let okH=null; if(res&&okArr){okH=true; for(let q=hl.a;q<=hl.b;q++) if(!okArr[q-u.a]) okH=false;}
      out.push(esc(f[0])+'<span class="hole'+(peekSet&&peekSet.has(x)?' peek':'')+(res?' rev '+(okH?'ok':'no'):'')+'" data-a="peek" data-h="'+x+'" style="min-width:'+Math.min(14,Math.max(3.2,words.length*0.5))+'em">'+(S.set.hint&&!res?'<span class="hg">'+esc(VID[hl.v].vi)+'</span>':'')+'<span class="hw">'+esc(words)+'</span></span>'+esc(l[2])); k=hl.b+1; continue; }
    const t=s.tok[k]; let cls='tk'; if(res&&okArr) cls+=okArr[k-u.a]?' ok':' no'; out.push('<span class="'+cls+'">'+esc(t)+'</span>'); k++; }
  return {html:out.join(' '),holes}; }

    .catch(e=>{ if(OV!==o&&!(OV&&OV.child===o)) return; o.phase='ready'; micErr(e); drawOv(); }); return true; }
  if(a==='mstop'){stopRec(); return true;}

  quizBody(){ if(o.qi>=o.quiz.length){ return doneHTML('Xong '+o.ids.length+' từ','Kiểm tra nhanh đúng '+o.right+'/'+o.quiz.length+'. Các từ đã được đưa vào lịch ôn tập.')+'<button class="btn pri wide" data-a="'+(onFinish?'lnFinish':'closeOv')+'">'+(onFinish?'Tiếp tục':'Xong')+'</button>'; }

   if(o.qans!=null) h+=fbHTML(o.qans===q.id,v)+'<button class="btn pri wide" data-a="lqn">Tiếp</button>'; return h; },
  after(){ if(!o.quiz&&o.st===0&&!o._s&&o.ids.length){o._s=true; setTimeout(()=>say(o.cur().en),200);} },
  on(a,el){ const v=o.ids.length?o.cur():null;

   if(a==='lplayw'){playOcc(o.occs()[o.occ]); return true;}

   if(a==='lq'){ const q=o.quiz[o.qi]; o.qans=el.dataset.id; const ok=o.qans===q.id; if(ok) o.right++; grade(q.id,ok?3:1,ok?(q.t==='pic'?1:0):null); drawOv(); return true; }
   if(a==='lqn'){o.qi++; o.qans=null; drawOv(); return true;}
   if(a==='lnFinish'){onFinish&&onFinish(); return true;}

/* ================= ÔN TẬP FSRS (mỗi lần hỏi theo một chiều) ================= */
function Review(ids,title,onFinish){ const o={title,q:ids.map(id=>({id})),i:0,phase:'ready',ans:null,ok:null,heard:'',typed:'',peek:new Set(),good:0,again:new Set(),
  progress(){return o.q.length?o.i/o.q.length:1;},
  pickDir(id){ const c=S.srs[id]||{dir:0,reps:0}; const un=[0,1,2,3,4].filter(k=>!(c.dir&(1<<k))); const pool=un.length?un:[0,1,2,3,4];
    let d=pool[(c.reps+id.length)%pool.length]; if((d===3||d===4)&&!(OCC[id]||[]).length) d=0; return d; },
  cur(){ const it=o.q[o.i]; if(it.d==null){ it.d=o.pickDir(it.id); if(it.d===0||it.d===3) it.opts=shuffle([it.id,...distract(it.id,3,it.d===0?'vi':'en')]); } return it; },
  unit(){const it=o.cur(); const oc=(OCC[it.id]||[])[0]; return oc?unitOf(oc.si,oc.a):null;},

   if(o.i>=o.q.length) return doneHTML('Đã ôn xong','Nhớ tốt '+o.good+' lượt. Lịch ôn đã được tính lại cho từng từ.')+'<button class="btn pri wide" data-a="'+(onFinish?'rvFin':'closeOv')+'">'+(onFinish?'Tiếp tục':'Xong')+'</button>';
   const it=o.cur(), v=VID[it.id], d=it.d; let h='<div class="row"><span class="eyebrow grow">'+esc(title)+' · '+(o.i+1)+'/'+o.q.length+' · '+DIRS[d]+'</span>'+lotusHTML(v.id)+'</div>';
   const done=o.phase==='result';
   if(d===0){ h+='<div class="card fc" style="min-height:150px"><button class="mic" data-a="tts" data-text="'+esc(v.en)+'" aria-label="Nghe lại">'+IC.speaker+'</button><p class="small muted">Nghe rồi chọn nghĩa đúng</p>'+(done?'<div class="big">'+esc(v.en)+'</div>':'')+'</div>'+optsHTML(it.opts,it.id,o.ans,'vi','rvopt'); }
   if(d===1){ h+='<div class="card stack" style="align-items:center;text-align:center">'+ill(v)+'<b style="font-size:1.2em;color:var(--saffron)">'+esc(v.vi)+'</b>'+(done||o.phase==='self'?'<div class="big" style="font-family:var(--f-text);font-size:1.5em">'+esc(v.en)+'</div>'+phHTML(v.en):'<p class="small muted">Nói từ tiếng Anh của hình này</p>')+'</div>';
     if(!done) h+=o.phase==='self'?selfBlock():micBlock(o,false); }
   if(d===2){ h+='<div class="card stack" style="align-items:center;text-align:center">'+ill(v)+'<b style="font-size:1.2em;color:var(--saffron)">'+esc(v.vi)+'</b><p class="small muted">Gợi ý: bắt đầu bằng “'+esc(v.en[0])+'”, '+v.en.split(/\s+/).length+' chữ</p></div><input class="typein '+(done?(o.res?'ok':'no'):'')+'" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ tiếng Anh" value="'+esc(o.typed)+'" '+(done?'disabled':'')+'>'+(done?'':'<button class="btn pri wide" data-a="rvtype">Kiểm tra</button>'); }
   if(d===3){ const oc=(OCC[it.id]||[])[0]; const s=SENT[oc.si]; const toks=s.tok.map((t,k)=>k===oc.a?esc(tokParts(t)[0])+'<span class="hole'+(o.ans!=null?' rev '+(o.ans===it.id?'ok':'no'):'')+'"><span class="hw">'+esc(v.en)+'</span></span>'+esc(tokParts(s.tok[oc.b])[2]):(k>oc.a&&k<=oc.b?null:esc(t))).filter(x=>x!==null);
     h+='<div class="card"><p class="say" style="font-size:1.1em">'+toks.join(' ')+'</p></div>'+optsHTML(it.opts,it.id,o.ans,'en','rvopt'); }
   if(d===4){ const u=o.unit(); const r=holeSay(u,id=>id===v.id,done,o.ok,o.peek); h+='<div class="card stack"><p class="say">'+r.html+'</p><button class="btn sm" data-a="rvplay" style="align-self:flex-start">'+IC.ear+'Nghe giọng tụng</button></div>'; if(!done) h+=o.phase==='self'?selfBlock():micBlock(o,true); }
   if(done){ h+=(o.sc!=null&&(d===1||d===4)?scoreHTML(o.sc,o.heard):'')+fbHTML(o.res,v)+(o.res?'<div class="two"><button class="btn" data-a="rvg" data-g="3">Nhớ · tiếp</button><button class="btn pri" data-a="rvg" data-g="4">Dễ quá</button></div>':'<button class="btn pri wide" data-a="rvg" data-g="1">Tiếp (sẽ hỏi lại)</button>'); }
   return h; },
  after(){ const it=o.q[o.i]; if(it&&it.d===0&&o.ans==null&&!it._s){it._s=true; setTimeout(()=>say(VID[it.id].en),200);} const t=$('tin'); if(t&&o.phase!=='result'){t.focus(); t.oninput=()=>o.typed=t.value; t.onkeydown=e=>{if(e.key==='Enter') o.on('rvtype');};} },
  on(a,el){ const it=o.q[o.i]; if(micOn(o,a,el)) return true;

   if(a==='rvplay'){playUnit(o.unit()); return true;}
   if(a==='rvFin'){onFinish&&onFinish(); return true;}
   if(a==='peek'){peekHole(el,o.peek,+el.dataset.h); return true;}

     o.i++; o.phase='ready'; o.ans=null; o.ok=null; o.heard=''; o.typed=''; o.sc=null; o.peek.clear(); drawOv(); $('ov').scrollTop=0; return true; }
  }}; return o; }

/* ================= THẺ TỪ (lật xem) ================= */
function Deck(ids,title){ const o={title,ids:ids.slice(),i:0,flip:false,

   h+='</div><div class="two"><button class="btn" data-a="tts" data-text="'+esc(v.en)+'">'+IC.speaker+'Giọng máy</button><button class="btn" data-a="kinhword" data-v="'+v.id+'">'+IC.ear+'Nghe trong kinh</button></div><div class="two"><button class="btn" data-a="dprev" '+(o.i?'':'disabled')+'>Thẻ trước</button><button class="btn pri" data-a="dnext">Thẻ sau</button></div>'; return h; },

/* ================= TRÒ CHƠI ================= */
function pool(n){ let ids=selIds(); if(ids.length<6) ids=VOC.map(v=>v.id); const pri=ids.filter(id=>S.hard[id]||(S.srs[id]&&S.srs[id].due<=dayNum())); const rest=shuffle(ids.filter(id=>!pri.includes(id))); return shuffle(pri).concat(rest).slice(0,n); }
function GamesMenu(){ return {title:'Trò chơi từ vựng', body(){ return '<p class="muted">Mỗi lượt 10 câu, ưu tiên từ khó và từ đến hạn ôn.</p><div class="opts">'+
  [['pic','Nhìn hình chọn từ','Xem hình minh họa, chọn từ tiếng Anh đúng'],['match','Nối từ Anh – Việt','Chạm một từ rồi chạm nghĩa của nó'],['mean','Chọn nghĩa đúng','Xem từ tiếng Anh, chọn nghĩa tiếng Việt'],['listen','Nghe và chọn từ','Nghe đọc, chọn đúng từ vừa nghe'],['type','Gõ từ tiếng Anh','Xem nghĩa và hình, gõ lại từ']].map(([k,t,d])=>'<button class="opt" data-a="gstart" data-g="'+k+'"><b>'+t+'</b><br><span class="small muted">'+d+'</span></button>').join('')+'</div>';},
  on(a,el){ if(a==='gstart'){openOv(Game(el.dataset.g)); return true;} } }; }
function Game(type){ const N=type==='match'?2:10; const o={type,i:0,n:N,right:0,ans:null,
  progress(){return o.i/o.n;}, make(){ if(type==='match'){const ids=pool(5); o.q={ids,left:shuffle(ids),right:shuffle(ids),pick:null,done:new Set(),bad:null};} else {const id=pool(1)[0]; const f=type==='mean'?'vi':'en'; o.q={id,opts:type==='type'?null:shuffle([id,...distract(id,3,f)])};} o.ans=null; o.typed=''; },
  body(){ if(o.i>=o.n) return doneHTML(o.right+'/'+o.n,'Đã hoàn thành trò chơi.')+'<div class="two"><button class="btn" data-a="closeOv">Xong</button><button class="btn pri" data-a="again">Chơi lại</button></div>';
   if(!o.q) o.make(); const q=o.q;
   if(type==='match'){ const b=(side,id)=>{const v=VID[id]; const cls=q.done.has(id)?'gone':(q.pick&&q.pick.side===side&&q.pick.id===id?'pick':'')+(q.bad&&q.bad.includes(side+id)?' no':''); return '<button class="opt '+cls+'" data-a="gm" data-side="'+side+'" data-id="'+id+'">'+esc(side==='L'?v.en:v.vi)+'</button>';};
     let h='<h2>Nối từ với nghĩa</h2><div class="match">'; for(let k=0;k<q.left.length;k++) h+=b('L',q.left[k])+b('R',q.right[k]); return h+'</div>'; }
   const v=VID[q.id]; let h='';
   if(type==='pic') h+='<div class="eyebrow">Nhìn hình chọn từ</div>'+ill(v);
   if(type==='mean') h+='<div class="eyebrow">Chọn nghĩa đúng</div><div class="card fc" style="min-height:140px"><div class="big">'+esc(v.en)+'</div>'+phHTML(v.en)+'<button class="btn sm" data-a="tts" data-text="'+esc(v.en)+'">'+IC.speaker+'Nghe</button></div>';
   if(type==='listen') h+='<div class="eyebrow">Nghe và chọn từ đúng</div><div class="card fc" style="min-height:140px"><button class="mic" data-a="tts" data-text="'+esc(v.en)+'" aria-label="Nghe lại">'+IC.speaker+'</button><button class="btn sm" data-a="ttsslow" data-text="'+esc(v.en)+'">'+IC.turtle+'Nghe chậm</button></div>';
   if(type==='type'){ h+='<div class="eyebrow">Gõ từ tiếng Anh</div>'+ill(v)+'<div style="text-align:center"><b style="font-size:1.2em;color:var(--saffron)">'+esc(v.vi)+'</b><p class="small muted">Bắt đầu bằng “'+esc(v.en.slice(0,1))+'”, gồm '+v.en.split(/\s+/).length+' chữ</p></div><input class="typein '+(o.ans==null?'':o.ans===true?'ok':'no')+'" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ ở đây" value="'+esc(o.typed)+'" '+(o.ans!=null?'disabled':'')+'>';
     if(o.ans==null) h+='<button class="btn pri wide" data-a="gtype">Kiểm tra</button>'; }
   else h+=optsHTML(q.opts,q.id,o.ans,type==='mean'?'vi':'en','gopt');
   if(o.ans!=null) h+=fbHTML(o.ans===q.id||o.ans===true,v)+'<button class="btn pri wide" data-a="gnext">Tiếp</button>';
   return h; },
  after(){ if(o.i<o.n&&type==='listen'&&o.ans==null&&!o._s){o._s=true; setTimeout(()=>say(VID[o.q.id].en),150);} const t=$('tin'); if(t&&o.ans==null){t.focus(); t.oninput=()=>o.typed=t.value; t.onkeydown=e=>{if(e.key==='Enter') o.on('gtype');};} },
  on(a,el){ const q=o.q;
   if(a==='again'){openOv(Game(type)); return true;}
   if(a==='gopt'){ o.ans=el.dataset.id; if(o.ans===q.id) o.right++; else miss(q.id); drawOv(); return true;}
   if(a==='gtype'){ const t=($('tin')||{}).value||''; const n=s=>s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim(); const v=VID[q.id]; const ok=v.f.concat([v.en]).some(f=>{const A=n(t),B=n(f); return A===B||(B.length>6&&lev(A,B)<=1);}); o.ans=ok?true:'x'; if(ok) o.right++; else miss(q.id); drawOv(); return true;}
   if(a==='gnext'){ o.i++; o.q=null; o._s=false; drawOv(); return true;}
   if(a==='gm'){ const side=el.dataset.side, id=el.dataset.id; if(!q.pick||q.pick.side===side){q.pick={side,id}; q.bad=null; drawOv(); return true;}
     if(q.pick.id===id){q.done.add(id); q.pick=null; if(q.done.size===q.ids.length){o.right++; o.i++; setTimeout(()=>{o.q=null; drawOv();},350);} }
     else { q.bad=[q.pick.side+q.pick.id, side+id]; miss(side==='L'?id:q.pick.id); q.pick=null; }
     drawOv(); return true;}
  }}; return o; }

/* ================= LUYỆN NÓI ĐỤC LỖ ================= */
function Speak(unitIdx,title,onFinish){ const o={title,list:unitIdx,i:0,phase:'ready',heard:'',ok:null,typing:false,peek:new Set(),scores:[],lvl:S.set.lvl,
  progress(){return o.list.length?o.i/o.list.length:1;},
  u(){return UNITS[o.list[o.i]];},
  hide(id){ const v=VID[id]; return (o.lvl>=2&&o.lvl<4&&isSel(id))||(o.lvl===3&&BUDDHIST.has(v.c)); },
  target(){const u=o.u(); return SENT[u.s].tok.slice(u.a,u.b+1);},
  onScore(ok,heard){ const u=o.u(); o.ok=ok; o.heard=heard; const sc=Math.round(100*ok.filter(Boolean).length/ok.length); o.sc=sc; o.scores.push(sc); logSpeak(sc,unitText(u));
    holeSay(u,id=>o.hide(id)).holes.forEach(hl=>{let g=true; for(let q=hl.a;q<=hl.b;q++) if(!ok[q-u.a]) g=false; if(!g) miss(hl.v);}); o.phase='result'; drawOv(); },
  body(){ if(o.i>=o.list.length){ const avg=o.scores.length?Math.round(o.scores.reduce((a,b)=>a+b,0)/o.scores.length):0; return doneHTML(avg+'%','Điểm trung bình '+o.scores.length+' đoạn.')+'<button class="btn pri wide" data-a="'+(onFinish?'spFinish':'closeOv')+'">'+(onFinish?'Tiếp tục':'Xong')+'</button>'; }
   const u=o.u(); const s=SENT[u.s]; const res=o.phase==='result';

    const W=WORDS[wordAt(t)]; ov.querySelectorAll('.tk.now').forEach(e=>e.classList.remove('now')); const w=ov.querySelector('#Tw'+W.s+'_'+W.k); if(w) w.classList.add('now'); },

   if(a==='t1opt'){ const q=C.main[lesson][o.qi]; o.ans=+el.dataset.k; if(o.ans===q[2]) o.right++; drawOv(); return true;}

function Fill(lesson,title){ const items=[]; LES[lesson].sents.forEach(si=>SPANS[si].forEach(p=>{if(isSel(p.v)) items.push({si,p});}));
  const L=shuffle(items).slice(0,8); const o={title,L,i:0,ans:null,right:0,hint:false,
  progress(){return o.L.length?o.i/o.L.length:1;},
  body(){ if(!o.L.length) return '<div class="empty">Bài này chưa có từ đang học. Thầy vào “Chọn từ” để thêm từ.</div><button class="btn wide" data-a="closeOv">Đóng</button>';
   if(o.i>=o.L.length) return doneHTML(o.right+'/'+o.L.length,'Đã điền xong.')+'<button class="btn pri wide" data-a="closeOv">Xong</button>';
   const it=o.L[o.i]; if(!it.opts) it.opts=shuffle([it.p.v,...distract(it.p.v,3,'en')]); const s=SENT[it.si]; const v=VID[it.p.v];
   const toks=s.tok.map((t,k)=>{ if(k===it.p.a){ const fp=tokParts(t), lp=tokParts(s.tok[it.p.b]); return esc(fp[0])+'<span class="hole'+(o.ans!=null?' rev '+(o.ans===v.id?'ok':'no'):'')+'">'+(o.hint&&o.ans==null?'<span class="hg">'+esc(v.vi)+'</span>':'')+'<span class="hw">'+(o.ans!=null?esc(v.en):'')+'</span></span>'+esc(lp[2]); } if(k>it.p.a&&k<=it.p.b) return null; return esc(t); }).filter(x=>x!==null);
   let h='<div class="eyebrow">'+esc(title)+' · '+(o.i+1)+'/'+o.L.length+'</div><div class="card stack"><p class="say">'+toks.join(' ')+'</p>'+(o.ans==null?'<button class="hint-toggle" data-a="fhint" style="align-self:flex-start">'+(o.hint?'Ẩn gợi ý':'Gợi ý nghĩa tiếng Việt')+'</button>':'<button class="btn sm" data-a="fplay" style="align-self:flex-start">'+IC.ear+'Nghe câu này</button>')+'</div>';
   h+=optsHTML(it.opts,v.id,o.ans,'en','fopt'); if(o.ans!=null) h+=fbHTML(o.ans===v.id,v)+'<button class="btn pri wide" data-a="fnext">Tiếp</button>'; return h; },
  on(a,el){ const it=o.L[o.i];
   if(a==='fhint'){o.hint=!o.hint; drawOv(); return true;}
   if(a==='fopt'){o.ans=el.dataset.id; if(o.ans===it.p.v) o.right++; else miss(it.p.v); drawOv(); return true;}
   if(a==='fplay'){const s=SENT[it.si]; playSeg(s.start,s.end); return true;}
   if(a==='fnext'){o.i++; o.ans=null; o.hint=false; stopAudio(); drawOv(); return true;}
  }}; return o; }
function Order(lesson){ const L=shuffle(LES[lesson].units.filter(ui=>{const u=UNITS[ui]; const n=u.b-u.a+1; return n>=5&&n<=15;})).slice(0,6);
  const o={title:'Sắp xếp câu',L,i:0,picked:[],res:null,right:0,
  progress(){return o.L.length?o.i/o.L.length:1;},
  setup(){ const u=UNITS[o.L[o.i]]; const toks=SENT[u.s].tok.slice(u.a,u.b+1); const n=toks.length; const parts=n<=6?3:n<=9?4:5; const size=Math.ceil(n/parts); const ch=[]; for(let k=0;k<n;k+=size) ch.push(toks.slice(k,k+size).join(' ')); o.chunks=ch; let sh=shuffle(ch.map((_,k)=>k)); let g=0; while(sh.every((x,k)=>x===k)&&g++<5) sh=shuffle(sh); o.order=sh; o.picked=[]; o.res=null; },
  body(){ if(!o.L.length) return '<div class="empty">Bài này không có câu phù hợp.</div>';
   if(o.i>=o.L.length) return doneHTML(o.right+'/'+o.L.length,'Đã sắp xếp xong.')+'<div class="two"><button class="btn" data-a="closeOv">Xong</button><button class="btn pri" data-a="oagain">Làm lại</button></div>';
   if(!o.chunks) o.setup(); const u=UNITS[o.L[o.i]];
   let h='<div class="eyebrow">Sắp xếp câu · '+(o.i+1)+'/'+o.L.length+'</div><p class="muted small">Chạm các cụm từ theo đúng thứ tự câu kinh. Chạm cụm đã xếp để bỏ ra.</p>';
   h+='<div class="tray">'+o.picked.map((c,k)=>'<button class="chunk" data-a="ounpick" data-k="'+k+'" '+(o.res!=null?'disabled':'')+'>'+esc(o.chunks[c])+'</button>').join('')+'</div>';
   h+='<div class="chips">'+o.order.map(c=>'<button class="chunk'+(o.picked.includes(c)?' used':'')+'" data-a="opick" data-c="'+c+'">'+esc(o.chunks[c])+'</button>').join('')+'</div><button class="btn sm" data-a="oplay" style="align-self:flex-start">'+IC.ear+'Nghe gợi ý</button>';
   if(o.res!=null) h+='<div class="feedback '+(o.res?'ok':'no')+'">'+(o.res?'Đúng rồi!':'Chưa đúng thứ tự')+'<small>'+esc(unitText(u))+'</small></div><button class="btn pri wide" data-a="onext">Tiếp</button>';
   else h+='<button class="btn pri wide" data-a="ocheck" '+(o.picked.length<o.chunks.length?'disabled':'')+'>Kiểm tra</button>';
   return h; },
  on(a,el){ const u=UNITS[o.L[o.i]];
   if(a==='opick'){const c=+el.dataset.c; if(o.res==null&&!o.picked.includes(c)) o.picked.push(c); drawOv(); return true;}
   if(a==='ounpick'){o.picked.splice(+el.dataset.k,1); drawOv(); return true;}
   if(a==='oplay'){playUnit(u); return true;}
   if(a==='ocheck'){const ok=o.picked.every((c,k)=>o.chunks[c]===o.chunks[k]); o.res=ok; if(ok) o.right++; playUnit(u); drawOv(); return true;}
   if(a==='onext'){o.i++; o.chunks=null; stopAudio(); drawOv(); return true;}
   if(a==='oagain'){openOv(Order(lesson)); return true;}
  }}; return o; }

/* ================= PHÁT ÂM: lỗi người Việt hay gặp ================= */
const PRON=(()=>{ const words=Object.keys(PH); const vowels=/[aeiouæɑɔəɛɪʊʌɝɚ]/;
  const ed=words.filter(w=>/ed$/.test(w)&&w.length>4&&!/eed$/.test(w)).map(w=>{const i=PH[w][0]; const t=/[ɪə]d$/.test(i)?'/ɪd/':/t$/.test(i)?'/t/':/d$/.test(i)?'/d/':null; return t?{w,ans:t}:null;}).filter(Boolean);
  const s=words.filter(w=>/[^s]s$/.test(w)&&w.length>4&&!/(ous|us|is|ss)$/.test(w)).map(w=>{const i=PH[w][0]; const t=/[ɪə]z$/.test(i)?'/ɪz/':/s$/.test(i)?'/s/':/z$/.test(i)?'/z/':null; return t?{w,ans:t}:null;}).filter(Boolean);
  const th=words.filter(w=>/th/.test(w)).map(w=>{const i=PH[w][0]; const t=i.includes('θ')?'/θ/ (thè lưỡi, không rung)':i.includes('ð')?'/ð/ (thè lưỡi, có rung)':null; return t?{w,ans:t}:null;}).filter(Boolean);
  const iv=words.filter(w=>PH[w][2]===1).map(w=>{const i=PH[w][0].replace(/aɪ|eɪ|ɔɪ/g,''); const L=i.includes('i'), Sh=i.includes('ɪ'); return L!==Sh?{w,ans:L?'/i/ dài':'/ɪ/ ngắn'}:null;}).filter(Boolean);
  const stress=VOC.filter(v=>!/\s/.test(v.en)&&PH[v.en.toLowerCase()]&&PH[v.en.toLowerCase()][2]>=2&&PH[v.en.toLowerCase()][3]>=0).map(v=>({w:v.en.toLowerCase(),ans:PH[v.en.toLowerCase()][3]}));
  const fin=VOC.filter(v=>!/\s/.test(v.en)&&PH[v.en.toLowerCase()]&&/[^aeiouæɑɔəɛɪʊʌɝɚ][^aeiouæɑɔəɛɪʊʌɝɚː]$/.test(PH[v.en.toLowerCase()][0])).map(v=>({w:v.en}));
  return [
   {k:'fin',t:'Âm cuối',d:'Người Việt hay nuốt âm cuối, như mind thành “mai”, truths thành “tru”. Thầy nói thật rõ phụ âm cuối mỗi từ.',items:fin,type:'say'},
   {k:'ed',t:'Đuôi -ed',d:'Đuôi -ed có 3 cách đọc: /t/ sau âm vô thanh (preached), /d/ sau âm hữu thanh (lowered), /ɪd/ sau t, d (located).',items:ed,opts:['/t/','/d/','/ɪd/']},
   {k:'s',t:'Đuôi -s',d:'Đuôi -s có 3 cách đọc: /s/ (truths), /z/ (beings), /ɪz/ (challenges). Không được bỏ âm này.',items:s,opts:['/s/','/z/','/ɪz/']},
   {k:'th',t:'Âm th',d:'th không đọc như “th” tiếng Việt. Đặt đầu lưỡi giữa hai răng: /θ/ không rung (breath, truth), /ð/ có rung (the, this, breathe).',items:th,opts:['/θ/ (thè lưỡi, không rung)','/ð/ (thè lưỡi, có rung)']},
   {k:'iv',t:'Nguyên âm i dài – ngắn',d:'/i/ dài và căng như deep, peace; /ɪ/ ngắn và thả lỏng như sit, still, sin.',items:iv,opts:['/i/ dài','/ɪ/ ngắn']},
   {k:'st',t:'Trọng âm',d:'Tiếng Anh nhấn mạnh một âm tiết trong từ. Nhấn sai làm người nghe khó hiểu: im-PER-ma-nent, CON-tem-plate.',items:stress,type:'stress'},
  ]; })();
function Pron(k){ const T=PRON.find(x=>x.k===k); const items=shuffle(T.items).slice(0,10); const o={title:T.t,T,items,i:0,ans:null,right:0,phase:'ready',heard:'',intro:true,
  progress(){return o.intro?0:o.i/o.items.length;},
  target(){return [o.items[o.i].w];},
  onScore(ok,heard){o.sc=ok[0]?100:0; o.heard=heard; o.phase='result'; if(ok[0]) o.right++; logSpeak(o.sc,''); drawOv();},
  body(){ if(o.intro) return '<div class="card stack"><h2>'+esc(T.t)+'</h2><p>'+esc(T.d)+'</p><p class="small muted">'+T.items.length+' từ trong kinh thuộc nhóm này. Mỗi lượt luyện 10 từ.</p></div><button class="btn pri wide" data-a="prgo">Bắt đầu</button>';
   if(o.i>=o.items.length) return doneHTML(o.right+'/'+o.items.length,'Đã luyện xong nhóm “'+T.t+'”.')+'<div class="two"><button class="btn" data-a="closeOv">Xong</button><button class="btn pri" data-a="pragain">Luyện tiếp</button></div>';
   const it=o.items[o.i]; const p=PH[it.w.toLowerCase()]||['','',1,0]; let h='<div class="eyebrow">'+esc(T.t)+' · '+(o.i+1)+'/'+o.items.length+'</div><div class="card fc" style="min-height:160px"><div class="big">'+esc(it.w)+'</div>'+(o.ans!=null||o.phase==='result'||T.type==='say'?phHTML(it.w):'')+'<div class="row" style="justify-content:center"><button class="btn sm" data-a="tts" data-text="'+esc(it.w)+'">'+IC.speaker+'Nghe</button><button class="btn sm" data-a="ttsslow" data-text="'+esc(it.w)+'">'+IC.turtle+'Chậm</button></div></div>';
   if(T.type==='say'){ h+=o.phase==='result'?scoreHTML(o.sc,o.heard)+'<button class="btn pri wide" data-a="prnext">Tiếp</button>':o.phase==='self'?selfBlock():micBlock(o,false); h+=recBox('pr'+it.w,cb=>say(it.w,null,cb),5); if(o.phase!=='result') h+='<button class="btn ghost wide" data-a="prnext">Bỏ qua</button>'; return h; }
   if(T.type==='stress'){ const syl=p[1].split('-').map(x=>x.toLowerCase()); h+='<p class="muted">Âm tiết nào được nhấn mạnh?</p><div class="chips">'+syl.map((x,k)=>{let c=''; if(o.ans!=null){if(k===it.ans) c='background:var(--ok-soft);border-color:var(--ok)'; else if(k===o.ans) c='background:var(--bad-soft);border-color:var(--bad)';} return '<button class="fchip" data-a="prs" data-k="'+k+'" style="font-size:1.1em;'+c+'" '+(o.ans!=null?'disabled':'')+'>'+esc(x)+'</button>';}).join('')+'</div>';
     if(o.ans!=null) h+='<div class="feedback '+(o.ans===it.ans?'ok':'no')+'">'+(o.ans===it.ans?'Đúng rồi!':'Chưa đúng')+'<small>'+p[1].split('-').map((x,k)=>k===it.ans?'<b>'+esc(x)+'</b>':esc(x.toLowerCase())).join(' · ')+'</small></div><button class="btn pri wide" data-a="prnext">Tiếp</button>'; return h; }
   h+='<p class="muted">Nghe rồi chọn cách đọc đúng</p><div class="opts">'+T.opts.map(x=>{let c=''; if(o.ans!=null){if(x===it.ans) c='ok'; else if(x===o.ans) c='no';} return '<button class="opt '+c+'" data-a="pro" data-v="'+esc(x)+'" '+(o.ans!=null?'disabled':'')+'>'+esc(x)+'</button>';}).join('')+'</div>';
   if(o.ans!=null) h+='<div class="feedback '+(o.ans===it.ans?'ok':'no')+'">'+(o.ans===it.ans?'Đúng rồi!':'Chưa đúng')+'<small>'+esc(it.w)+' '+esc(p[0])+' → '+esc(it.ans)+'</small></div><button class="btn pri wide" data-a="prnext">Tiếp</button>';
   return h; },
  after(){ if(!o.intro&&o.i<o.items.length&&!o._s){o._s=true; setTimeout(()=>say(o.items[o.i].w),200);} },
  on(a,el){ if(micOn(o,a,el)) return true; const it=o.items[o.i];
   if(a==='prgo'){o.intro=false; drawOv(); return true;}
   if(a==='pragain'){openOv(Pron(k)); return true;}
   if(a==='pro'){o.ans=el.dataset.v; if(o.ans===it.ans) o.right++; drawOv(); return true;}
   if(a==='prs'){o.ans=+el.dataset.k; if(o.ans===it.ans) o.right++; drawOv(); return true;}
   if(a==='prnext'){o.i++; o.ans=null; o.phase='ready'; o.heard=''; o._s=false; drawOv(); return true;}
  }}; return o; }

/* ================= GIA SƯ AI ================= */
const SUTRA_BRIEF='Key teachings of the Sutra of Right Meditative Endeavour (taught by Venerable Sariputta): Right Meditative Endeavour is the early, patient stage of meditation; two complementary paths: Cessation (techniques) and Insight (contemplation of doctrine); sit in full lotus posture: spine upright, body relaxed yet still, palms facing upward, eyes lowered, tongue touching the upper palate (Body Stabilization); contemplate that the body is impermanent; observe the breath in and out gently; wandering thoughts come from the lower abdomen, not the head; keep the breath slow, little and gentle until the breath "sticks" to the mind; anchor the mind at the Kanda point about six centimetres below the navel; joyful feelings can cause self-praise and pride, so Cessation must be paired with Insight; contemplate that the body is unclean, the result of karma, a burden, and that "this self is but ignorance and sins" to keep humility; merit is essential: reverence to the Perfectly Enlightened Ones and guiding sentient beings; never lose responsibility for all beings.';
function aiErr(e){ const c=e&&e.code; if(c==='not_granted'||c==='unavailable') return 'Gia sư AI chưa được bật cho trang này. Thầy cho phép quyền “hỏi Claude” khi trang hỏi nhé.'; if(c==='rate_limited') return 'Gia sư đang bận, Thầy đợi một lát rồi gửi lại nhé.'; return 'Chưa nhận được trả lời, Thầy gửi lại nhé.'; }
function Chat(role){ const intro='You are role-playing to help a Vietnamese Buddhist monk (the user; address him as "Venerable") practise speaking English about the Sutra of Right Meditative Endeavour.\nYOUR ROLE: '+role.ai+'\n'+SUTRA_BRIEF+'\nRULES: Stay in character. Use simple, clear English (CEFR A2–B1). Reply in 1–3 short sentences and usually ask one follow-up question so the Venerable keeps talking. Be warm and respectful.\nAfter each message from the Venerable, return ONLY a JSON object: {"reply": "your in-character English reply", "vi": "Vietnamese translation of reply", "fix": null or {"better": "a correct, natural English version of the Venerable\'s last message", "note": "brief explanation in Vietnamese of the main mistake"}, "praise": "one short encouraging sentence in Vietnamese"}. Set fix to null when his English was already correct and natural.';
  const o={title:role.t,msgs:[{role:'ai',reply:role.open,vi:'',fix:null}],busy:false,draft:'',ctl:null,showVi:{},
  body(){ let h='<div class="card stack"><b>'+esc(role.t)+'</b><p class="small muted">'+esc(role.d)+'</p>'+(role.kw.length?'<div class="chips">'+role.kw.map(k=>'<button class="fchip" data-a="chkw" data-t="'+esc(k)+'">'+esc(k)+'</button>').join('')+'</div><p class="small muted">Chạm từ gợi ý để chèn vào câu trả lời.</p>':'')+'</div><div class="chat">';
   o.msgs.forEach((m,k)=>{ if(m.role==='me') h+='<div class="msg me">'+esc(m.text)+'</div>';
     else { h+='<div class="msg ai"><div>'+esc(m.reply)+'</div><div class="row" style="margin-top:6px;gap:6px"><button class="btn sm" data-a="tts" data-text="'+esc(m.reply)+'">'+IC.speaker+'Nghe</button>'+(m.vi?'<button class="btn sm" data-a="chvi" data-k="'+k+'">Nghĩa</button>':'')+'</div>'+(o.showVi[k]&&m.vi?'<div class="tr">'+esc(m.vi)+'</div>':'')+(m.fix?'<div class="fix"><b>Câu của Thầy nên nói:</b> '+esc(m.fix.better)+' <button class="btn sm" data-a="tts" data-text="'+esc(m.fix.better)+'">'+IC.speaker+'</button><br><span class="small">'+esc(m.fix.note)+'</span></div>':'')+(m.praise?'<div class="tr">'+esc(m.praise)+'</div>':'')+'</div>'; } });
   if(o.busy) h+='<div class="msg ai typing">Đang trả lời…</div>'; h+='</div>';
   if(!SAMPLE) h+='<p class="note">Gia sư AI chỉ chạy khi mở app trên trang Claude. Bản cài lên điện thoại không có phần này.</p>';
   h+='<textarea class="typein" id="chin" placeholder="Thầy trả lời bằng tiếng Anh…" '+(o.busy||!SAMPLE?'disabled':'')+'>'+esc(o.draft)+'</textarea><div class="two">'+(SR&&!noMic()?'<button class="btn" data-a="chmic">'+IC.mic+'Nói</button>':'<span></span>')+'<button class="btn pri" data-a="chsend" '+(o.busy||!SAMPLE?'disabled':'')+'>'+IC.send+'Gửi</button></div>';
   return h; },
  after(){ const t=$('chin'); if(t){t.oninput=()=>o.draft=t.value;} const c=$('ov'); c.scrollTop=c.scrollHeight; const last=o.msgs[o.msgs.length-1]; if(last.role==='ai'&&!last._s){last._s=true; say(last.reply);} },
  abort(){ try{o.ctl&&o.ctl.abort();}catch(e){} },
  async send(){ const text=(o.draft||'').trim(); if(!text||o.busy||!SAMPLE) return; o.msgs.push({role:'me',text}); o.draft=''; o.busy=true; drawOv();
    const input=[{role:'user',content:intro+'\n\nBegin: your opening line was already said.'},{role:'assistant',content:JSON.stringify({reply:role.open,vi:'',fix:null,praise:''})}];
    o.msgs.slice(1).forEach(m=>{ if(m.role==='me') input.push({role:'user',content:m.text}); else input.push({role:'assistant',content:JSON.stringify({reply:m.reply,vi:m.vi,fix:m.fix,praise:m.praise})}); });
    o.ctl=new AbortController();
    try{ const r=await SAMPLE.json(input,{signal:o.ctl.signal,cache:false}); o.msgs.push({role:'ai',reply:String(r.reply||''),vi:String(r.vi||''),fix:r.fix&&r.fix.better?{better:String(r.fix.better),note:String(r.fix.note||'')}:null,praise:String(r.praise||'')}); }
    catch(e){ if(e&&e.code==='cancelled') return; o.msgs.pop(); o.draft=text; toast(aiErr(e)); }
    o.busy=false; if(OV===o) drawOv(); },
  on(a,el){ if(a==='chsend'){o.send(); return true;} if(a==='chvi'){const k=+el.dataset.k; o.showVi[k]=!o.showVi[k]; drawOv(); return true;}
   if(a==='chkw'){o.draft=(o.draft?o.draft.trim()+' ':'')+el.dataset.t; drawOv(); const t=$('chin'); if(t) t.focus(); return true;}
   if(a==='chmic'){ listen(t=>{const e=$('chin'); if(e) e.value=t;}).then(t=>{o.draft=t; drawOv();}).catch(micErr); return true;} }}; return o; }
function Retell(lesson,onFinish){ const R=C.retell[lesson]; const L=LES[lesson]; const o={title:'Kể lại bằng lời của mình',draft:'',busy:false,res:null,ctl:null,
  body(){ let h='<div class="card stack"><span class="eyebrow">Bài '+(lesson+1)+' · '+esc(L.t)+'</span><h3>'+esc(R[0])+'</h3><div class="chips">'+R[1].map(k=>'<span class="pill c-dharma">'+esc(k)+'</span>').join('')+'</div><p class="small muted">Viết hoặc nói 2–4 câu tiếng Anh, dùng các từ gợi ý.</p></div>';
   h+='<textarea class="typein" id="rtin" placeholder="Viết bằng tiếng Anh…" '+(o.busy?'disabled':'')+'>'+esc(o.draft)+'</textarea><div class="two">'+(SR&&!noMic()?'<button class="btn" data-a="rtmic">'+IC.mic+'Nói</button>':'<span></span>')+'<button class="btn pri" data-a="rtsend" '+(o.busy||!SAMPLE?'disabled':'')+'>'+(o.busy?'Đang chấm…':'Nhờ gia sư nhận xét')+'</button></div>';
   if(!SAMPLE) h+='<p class="note">Phần nhận xét bằng AI chỉ chạy khi mở app trên trang Claude. Thầy vẫn có thể viết, thu âm giọng đọc rồi tự so sánh với bài kinh.</p>';

function chantSync(force){ const t=aud.currentTime; const si=sentAt(t); const prev=chantCur;

  const c=$('tcur'); if(c) c.textContent=fmt(t); const sk=$('seek'); if(sk&&document.activeElement!==sk) sk.value=Math.round(t);

  const atEnd=P&&prev===lastS&&((si===prev+1&&SENT[si].pair!==SENT[prev].pair)||(prev===SENT.length-1&&t>=AUDIO_END-0.5));
