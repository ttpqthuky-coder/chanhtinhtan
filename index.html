function SettingsOv(){ return {title:'Cài đặt', confirmReset:false, body(){ const st=S.set;
  const opt=(a,vals,cur,fmtf)=>'<div class="chips">'+vals.map(v=>'<button class="fchip" data-a="'+a+'" data-v="'+v+'" aria-pressed="'+(cur==v)+'">'+(fmtf?fmtf(v):v)+'</button>').join('')+'</div>';
  return '<div class="card"><div class="setrow"><div><b>Mục tiêu mỗi ngày</b><br><span class="small muted">Số phút học để giữ chuỗi ngày</span></div>'+opt('sgoal',[10,15,20,30],st.goalMin,v=>v+' phút')+'</div>'+
   '<div class="setrow"><div><b>Số từ mới mỗi ngày</b><br><span class="small muted">Học vừa đủ để ôn kịp</span></div>'+opt('snew',[5,10,15,20],st.newPer)+'</div>'+
   '<div class="setrow"><b>Phiên âm</b>'+opt('sph',['ipa','vn','both','off'],st.ph,v=>({ipa:'IPA',vn:'Kiểu Việt',both:'Cả hai',off:'Tắt'})[v])+'</div>'+
   '<div class="setrow"><b>Cỡ chữ</b>'+opt('sfs',[0.9,1,1.15,1.3],st.fs,v=>({0.9:'Nhỏ',1:'Vừa',1.15:'Lớn',1.3:'Rất lớn'})[v])+'</div>'+
   '<div class="setrow"><b>Tốc độ giọng máy</b>'+opt('srate',[0.65,0.85,1],st.rate,v=>({0.65:'Chậm',0.85:'Vừa',1:'Thường'})[v])+'</div>'+
   '<div class="setrow"><b>Gợi ý tiếng Việt ở chỗ đục lỗ</b><button class="tog" data-a="shint" aria-pressed="'+st.hint+'">'+(st.hint?'Đang bật':'Đang tắt')+'</button></div>'+
   '<div class="setrow"><div><b>Mở khóa tất cả các chặng</b><br><span class="small muted">Không cần học xong chặng trước</span></div><button class="tog" data-a="sunlock" aria-pressed="'+st.unlock+'">'+(st.unlock?'Đang mở':'Đang khóa')+'</button></div></div>'+
   '<div class="card stack"><div class="row">'+IC.bell+'<b class="grow">Nhắc học hằng ngày</b></div><div class="row"><label for="rt" class="small muted">Giờ nhắc</label><input type="time" id="rt" value="'+esc(st.remind)+'" style="height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px"></div><a class="btn pri" id="calLink" href="'+esc(calUrl())+'" target="_blank" rel="noopener">Thêm lời nhắc vào Google Lịch</a><p class="small muted">Google Lịch trên điện thoại sẽ báo mỗi ngày đúng giờ này.</p></div>'+
   '<div class="card stack"><b>Tiến độ</b><p class="small muted">'+(syncState==='synced'?'Đã lưu vào tài khoản Claude, mở trên máy khác vẫn giữ tiến độ.':syncState==='error'?'Chưa lưu được lên tài khoản, tiến độ vẫn lưu trên máy này.':'Tiến độ lưu trên máy này.')+'</p>'+
   (this.confirmReset?'<p><b>Xoá toàn bộ tiến độ?</b> Lịch ôn, phút học, huy hiệu và sổ tay sẽ mất.</p><div class="two"><button class="btn" data-a="sresetno">Giữ lại</button><button class="btn bad" data-a="sresetyes">Xoá</button></div>':'<button class="btn ghost" data-a="sreset">Xoá tiến độ</button>')+'</div>'+
   '<div class="card stack"><b>Cài lên điện thoại Android</b><p class="small muted">Mở app bằng Chrome, bấm nút ⋮ rồi chọn “Thêm vào màn hình chính”. Ở bản cài đặt đầy đủ, micro dùng được để chấm phát âm và thu âm.</p></div>'; },
  after(){ const r=$('rt'); if(r) r.onchange=()=>{S.set.remind=r.value; save(); const l=$('calLink'); if(l) l.href=calUrl();}; },
  on(a,el){ const v=el.dataset.v; if(a==='sgoal') S.set.goalMin=+v; else if(a==='snew') S.set.newPer=+v; else if(a==='sph') S.set.ph=v; else if(a==='sfs'){S.set.fs=+v; applySettings();} else if(a==='srate'){S.set.rate=+v; say('Right Meditative Endeavour');} else if(a==='shint') S.set.hint=!S.set.hint; else if(a==='sunlock') S.set.unlock=!S.set.unlock;
   else if(a==='sreset'){this.confirmReset=true; drawOv(); return true;} else if(a==='sresetno'){this.confirmReset=false; drawOv(); return true;}
   else if(a==='sresetyes'){const sel=S.sel; S=DEF(); S.sel=sel; save(); this.confirmReset=false; toast('Đã xoá tiến độ'); drawOv(); updStreak(); return true;} else return false;
   save(); updStreak(); drawOv(); return true; }}; }

/* ---------- XỬ LÝ CHẠM ---------- */
const ACT={
 tab(el){UI.tab=el.dataset.t; if(UI.tab!=='kinh') stopAudio(); render(); window.scrollTo(0,0);},
 settings(){openOv(SettingsOv());},
 report(){openOv(ReportOv());},
 closeOv(){closeOv();},
 word(el){openOv(WordPage(el.dataset.v));},
 tts(el){say(el.dataset.text);},
 ttsslow(el){say(el.dataset.text,0.6);},
 kinhword(el){playVocabInKinh(VID[el.dataset.v]);},
 rec(el){recToggle(el.dataset.k,+el.dataset.max);}, recplay(el){playUser(el.dataset.k);}, reccmp(el){compare(el.dataset.k);},
 more(){wlLimit+=80; $('wl').innerHTML=wordList();},
 pick(){openOv(PickOv());},
 flash(){ openOv(Deck(shuffle(selIds()),'Thẻ từ')); },
 srs(){ openOv(Review(shuffle(dueIds()),'Ôn lặp lại')); },
 newwords(){ const ids=newIds().slice(0,newLeftToday()); openOv(Learn(ids,'Học từ mới')); },
 games(){openOv(GamesMenu());},
 hardlist(){ openOv({title:'Sổ tay từ khó',body(){ const L=VOC.filter(v=>S.hard[v.id]); return '<p class="muted small">Từ Thầy đánh dấu sao, hoặc từ trả lời sai từ 2 lần trở lên.</p>'+(L.length?'<button class="btn pri wide" data-a="hardrev">'+IC.repeat+'Ôn '+L.length+' từ khó</button><div class="wlist">'+L.map(v=>wordRow(v)).join('')+'</div>':'<div class="empty">Chưa có từ khó. Khi học, Thầy bấm ngôi sao để lưu từ vào đây.</div>');}, on(a){ if(a==='hardrev'){openOv(Review(shuffle(VOC.filter(v=>S.hard[v.id]).map(v=>v.id)),'Ôn từ khó')); return true;} }}); },
 lesson(el){const i=+el.dataset.l; if(locked(i)){toast('Hoàn thành chặng '+i+' để mở chặng này, hoặc mở khóa trong Cài đặt.'); return;} openOv(LessonMenu(i));},
 kmode(el){UI.kinh=el.dataset.m; if(UI.kinh!=='chant') stopAudio(); render(); window.scrollTo(0,0);},
 togVi(){S.set.vi=!S.set.vi; save(); if(OV) drawOv(); else render();},
 togBlur(){S.set.viblur=!S.set.viblur; UI.vrev={}; save(); render();},
 cyclePh(){const M=['both','vn','off']; S.set.ph=M[(M.indexOf(S.set.ph)+1)%M.length]; save(); render();},
 vrev(el){ if(!S.set.viblur) return; UI.vrev[el.dataset.k]=1; el.classList.remove('blur'); },
 gram(el){const k=el.dataset.k; UI.gopen[k]=!UI.gopen[k]; const sc=window.scrollY; render(); window.scrollTo(0,sc);},
 seek(el){ const s=SENT[+el.dataset.s]; if(UI.kinh==='chant'){biDone=-1; chantPlay(s.start);} else { playSeg(s.start,s.end,t=>{const W=WORDS[wordAt(t)]; document.querySelectorAll('#view .tk.now').forEach(e=>e.classList.remove('now')); const w=$('w'+W.s+'_'+W.k); if(w) w.classList.add('now');},()=>document.querySelectorAll('#view .tk.now').forEach(e=>e.classList.remove('now'))); } },
 cplay(){ if(aud.paused||stopAt!=null) chantPlay(stopAt!=null?SENT[Math.max(0,chantCur)].start:null); else aud.pause(); },
 cprev(){ const si=Math.max(0,sentAt(aud.currentTime)-(aud.currentTime-SENT[sentAt(aud.currentTime)].start<1.5?1:0)); biDone=-1; chantPlay(SENT[si].start); },
 cnext(){ const si=Math.min(SENT.length-1,sentAt(aud.currentTime)+1); biDone=-1; chantPlay(SENT[si].start); },
 cloop(el){chantLoop=!chantLoop; el.setAttribute('aria-pressed',chantLoop);},
 cbi(el){UI.bi=!UI.bi; biDone=-1; el.setAttribute('aria-pressed',UI.bi); if(UI.bi&&!VOICEVI) toast('Máy chưa có giọng đọc tiếng Việt, app sẽ hiện nghĩa trong vài giây.');},
 chide(){UI.chantHide=(UI.chantHide+1)%4; const playing=!aud.paused; const sc=window.scrollY; render(); window.scrollTo(0,sc); if(playing) chantSync(true);},
 arate(el){ const R=[0.75,1,1.25]; const k=(R.indexOf(S.set.arate||1)+1)%R.length; S.set.arate=R[k]; aud.playbackRate=R[k]; el.textContent=R[k]+'×'; save(); },
 ml(el){UI.ml=+el.dataset.l; memRev.clear(); render();},
 mlv(el){UI.mlv=+el.dataset.v; memRev.clear(); render();},
 mrev(el){ memRev.add(el.dataset.k); el.classList.remove('hid','ini'); const [a,b]=el.dataset.k.split('_'); el.textContent=SENT[+a].tok[+b]; },
 mplay(el){ const ss=ROWSENT[+el.dataset.r]; playSeg(SENT[ss[0]].start,SENT[ss[ss.length-1]].end); },
 mshow(el){ ROWSENT[+el.dataset.r].forEach(si=>SENT[si].tok.forEach((_,k)=>memRev.add(si+'_'+k))); render(); },
 pl(el){UI.pl=+el.dataset.l; render();},
 p_listen(){openOv(Listen3(UI.pl));},
 p_dict(){const o=Listen3(UI.pl); o.tier=3; openOv(o);},
 p_shadow(){openOv(Shadow(UI.pl));},
 p_cloze(){openOv(Speak(LES[UI.pl].units,'Luyện nói đục lỗ · Chặng '+(UI.pl+1)));},
 p_pat(){ const L=LES[UI.pl].pats; openOv(PatternOv(L.length?L:C.pat.map((_,k)=>k))); if(!L.length) toast('Chặng này không có mẫu câu riêng, app mở tất cả mẫu câu.'); },
 p_comp(){openOv(Comp(UI.pl));},
 p_fill(){openOv(Fill(UI.pl,'Điền từ · Chặng '+(UI.pl+1)));},
 p_order(){openOv(Order(UI.pl));},
 pron(el){openOv(Pron(el.dataset.k));},
 aichat(el){openOv(Chat(C.role[+el.dataset.k]));},
 airetell(el){openOv(Retell(+el.dataset.l));},
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a;
  if(OV&&$('ov').contains(el)&&OV.on&&OV.on(a,el)) return;
  if(ACT[a]) ACT[a](el,e); });
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){e.preventDefault(); e.target.click();} if(e.key==='Escape'&&OV) closeOv(); });
document.addEventListener('input',e=>{ if(e.target.id==='q'){UI.q=e.target.value; wlLimit=40; $('wl').innerHTML=wordList();} });
document.addEventListener('change',e=>{ if(e.target.id==='seek'){ biDone=-1; chantPlay(+e.target.value); } });
render(); checkBadges();


if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
